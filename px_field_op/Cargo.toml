[package]
name = "px_field_op"
version = "0.1.0"
edition = "2024"

# `dylib` 是给运行时装载的那个（`px_graph_schema::OpLibrary`）；
# `rlib` 只是为了让测试与 dev-dependency 能把这一份编出来（产品 exe 不链它，
# 判据是 `px_graphs` 的依赖门）。
[lib]
crate-type = ["dylib", "rlib"]

[dependencies]
# 图参数 struct 的 `PxInputs` 由它生成（字段名进键、按位置解字节）。
px_derive = { path = "../px_derive" }
px_protocol = { path = "../px_protocol" }
px_graph_schema = { path = "../px_graph_schema" }
px_field_schema = { path = "../px_field_schema" }
# ⚠ 类型化契约那一层（`src/typed.rs`）：图脚本静态链接的是**它**，不是本 crate 的 dylib。
px_cook = { path = "../px_cook" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[build-dependencies]
#  里的源码指纹用它（与键里的哈希同一个算法）。
blake3 = "1"
