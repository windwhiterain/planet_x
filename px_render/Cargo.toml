[package]
name = "px_render"
version = "0.1.0"
edition = "2024"

[dependencies]
# ⚠ 协议那一份（`material` / `scene` / `art` / 跨进程的作业形状与握手）全在它里面，
# 而它是**冻结且极小**的纯数据 crate（运行时只有 serde）⇒ 挂上没有 GPU 栈的代价。
px_protocol = { path = "../px_protocol" }
px_shader = { path = "../px_shader" }
px_pass = { path = "../px_pass" }

# 后端**锁死 Vulkan**（§104 第 9 条）。`default-features = false` 之后必须显式点名特性，
# 否则拿到的实例一个后端都没有 —— 那不是"默认"，那是空。
# ⚠ `std` 也在这一串里（2026-09-28）：从前它不在，靠 `egui-wgpu` 顺带合并进来 ——
#   偶然，不是声明；省掉它 wgpu-core 会走 no-std 那套同步实现，症状是多线程下错误域栈串了。
wgpu = { version = "29", default-features = false, features = ["std", "vulkan", "wgsl"] }
# 预览窗口（S7 前半）。**只开 `rwh_06`**：那是 wgpu 29 认的 raw-window-handle 版本，
# 而 winit 的缺省特性里另外那几项（x11 / wayland*）在本机（Windows）一个都用不上 ——
# 缺省特性是一份"没人写过"的选择，这里显式点名（§104 第 3 条）。
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
naga = { version = "29", features = ["wgsl-in"] }
# 调参面板那一侧要**改一行 TOML 而不动别的字节**（`src/edit.rs`）：`art/**/*.toml` 里的注释
# 是这批作品的**说明书**（每个数为什么是这个数都写在旁边那一行上面），`toml::to_string`
# 会把它整片抹掉 ⇒ 用保格式的编辑口。⚠ 版本对齐 `toml 0.8` 拉进来的那一份（同一个 crate
# 的两个 minor 都在 lock 里，点名的是新那一个）。
toml_edit = "0.25"
# 只读参数文件的内容（判据要拿它当 oracle：编辑之后**解出来的值**必须与编辑前逐字段相同）。
toml = "0.8"
# PNG 必须走 image（§104 第 3 条）：哈希是被这个编码器定下来的，不是被我们。
image = { version = "0.25", default-features = false, features = ["png"] }
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
# ⚠ `float_roundtrip` **必须开**：默认的浮点解析不是正确舍入的，于是
# "读进来再写回去"不是恒等（实测 `0.11999999731779099` 会读成 +1 ulp 的值）。
# 本仓库的判据是逐字节的，读不出写进去的东西就是缺陷 —— 代价是浮点解析约 2×，
# 而文档只有几 KB。五个 crate 都写一遍：别靠特性合并的偶然。
serde_json = { version = "1", features = ["float_roundtrip"] }
# 调参面板（S9）：**渲染宿主里那块 GUI**。
# ⚠ 版本是**配套**钉的，不是"最新"：`egui-wgpu 0.36` 要 `wgpu 30`，而本宿主锁死 `wgpu 29`
#   —— 两个 major 的 `wgpu` 同时进树的话，面板拿到的 `Device` 与画面那张 `Surface`
#   根本不是同一个类型。`0.35` 那一支要的正是 `wgpu 29` / `winit 0.30`。
# ⚠ 三个都关掉缺省特性：那些缺省里是 wayland / x11 / 剪贴板（`arboard`）/ `webbrowser`
#   （§104 第 3 条：缺省特性是一份"没人写过"的选择）。
egui = { version = "0.35", default-features = false, features = ["default_fonts"] }
egui-wgpu = { version = "0.35", default-features = false }
egui-winit = { version = "0.35", default-features = false }

[dev-dependencies]
# ⚠ **只在判据里**用真的 glam：`mat4.rs` 是"逐位移植"，而"移植得像不像"只能拿**原件**比。
# 生产代码故意不依赖 glam（那条注释在 `mat4.rs` 顶上：移植是为了不把 SSE2 后端当成契约）。
# 版本与 oracle 那条路（Bevy 0.19 → glam 0.32.1）对齐 —— 比错版本等于没比。
glam = "0.32"
