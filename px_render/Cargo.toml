[package]
name = "px_render"
version = "0.1.0"
edition = "2024"

[dependencies]
px_protocol = { path = "../px_protocol" }
px_pass = { path = "../px_pass" }
px_shader = { path = "../px_shader" }
bevy = { version = "0.19", features = ["file_watcher"] }
serde = { version = "1", features = ["derive"] }
# ⚠ `float_roundtrip` **必须开**：默认的浮点解析不是正确舍入的，于是
# "读进来再写回去"不是恒等（实测 `0.11999999731779099` 会读成 +1 ulp 的值）。
# 本仓库的判据是逐字节的，读不出写进去的东西就是缺陷 —— 代价是浮点解析约 2×，
# 而文档只有几 KB。五个 crate 都写一遍：别靠特性合并的偶然。
serde_json = { version = "1", features = ["float_roundtrip"] }
# 反射材质参数块用（`src/reflect.rs`）：解析产物里那份 WGSL，按它自己声明的结构体打包参数。
# 版本与 wgpu / naga_oil 自带的那一份是同一个（Cargo.lock 里只有一条 naga）。
naga = { version = "29", features = ["wgsl-in"] }

[dev-dependencies]
naga = { version = "29", features = ["wgsl-in", "hlsl-out"] }


