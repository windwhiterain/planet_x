[package]
name = "px_render"
version = "0.1.0"
edition = "2024"

[dependencies]
px_protocol = { path = "../px_protocol" }
# ⚠ 握手身份与线格式在叶子 crate 里：`ProtocolId::local()` 从那里来（它要 `protocol_hash()`）。
px-handshake = { path = "../px_handshake" }
px_shader = { path = "../px_shader" }
px_pass = { path = "../px_pass" }
# ⚠ 宿主协议面（作业形状 / 四种帧与信封 / 租约 + 客户端那半）住在只依赖 serde / serde_json /
# `px_protocol` 的这个 crate 里（闭包里**没有 GPU 栈**）。
# 它曾经住在本 crate 的三份 `mod`（`render_proto` / `client_proto` / `render_frame`），而那份摆法
# 逼着 `px_protocol` 的快照测试把 wgpu / naga / winit 一起编进来（dev 边 `px_protocol` → `px_render`），
# 依赖方向也整个反过来。搬完这里**一个字节的形状都没改**（`protocol_hash()` 不动）。
px_host_protocol = { path = "../px_host_protocol" }
# 后端**锁死 Vulkan**（§104 第 9 条）。`default-features = false` 之后必须显式点名后端，
# 否则拿到的实例一个后端都没有 —— 那不是"默认"，那是空。
wgpu = { version = "29", default-features = false, features = ["vulkan", "wgsl"] }
# 预览窗口（S7 前半）。**只开 `rwh_06`**：那是 wgpu 29 认的 raw-window-handle 版本，
# 而 winit 的缺省特性里另外那几项（x11 / wayland*）在本机（Windows）一个都用不上 ——
# 缺省特性是一份"没人写过"的选择，这里显式点名（§104 第 3 条）。
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
naga = { version = "29", features = ["wgsl-in"] }
# PNG 必须走 image（§104 第 3 条）：哈希是被这个编码器定下来的，不是被我们。
image = { version = "0.25", default-features = false, features = ["png"] }
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
# ⚠ `float_roundtrip` **必须开**：默认的浮点解析不是正确舍入的，于是
# "读进来再写回去"不是恒等（实测 `0.11999999731779099` 会读成 +1 ulp 的值）。
# 本仓库的判据是逐字节的，读不出写进去的东西就是缺陷 —— 代价是浮点解析约 2×，
# 而文档只有几 KB。五个 crate 都写一遍：别靠特性合并的偶然。
serde_json = { version = "1", features = ["float_roundtrip"] }

[dev-dependencies]
# ⚠ **只在判据里**用真的 glam：`mat4.rs` 是"逐位移植"，而"移植得像不像"只能拿**原件**比。
# 生产代码故意不依赖 glam（那条注释在 `mat4.rs` 顶上：移植是为了不把 SSE2 后端当成契约）。
# 版本与 oracle 那条路（Bevy 0.19 → glam 0.32.1）对齐 —— 比错版本等于没比。
glam = "0.32"
