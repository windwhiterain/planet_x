[project]
name = "planet-x-ctl"
version = "0.1.0"
description = "Turn pandas analysis of a planet_x checkpoint into a legal `--apply` control diff (the write-side twin of planet-xq)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0"]

[project.scripts]
planet-x-ctl = "planet_x_ctl:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
