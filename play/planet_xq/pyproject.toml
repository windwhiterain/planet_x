[project]
name = "planet-xq"
version = "0.1.0"
description = "Read planet_x --index projections into pandas: lean main stream + lazy id-indexed join."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0"]

[project.scripts]
planet-xq = "planet_xq:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
