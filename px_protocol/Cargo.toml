[package]
name = "px_protocol"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
# ⚠ `float_roundtrip` **必须开**：默认的浮点解析不是正确舍入的，于是
# "读进来再写回去"不是恒等（实测 `0.11999999731779099` 会读成 +1 ulp 的值）。
# 本仓库的判据是逐字节的，读不出写进去的东西就是缺陷 —— 代价是浮点解析约 2×，
# 而文档只有几 KB。五个 crate 都写一遍：别靠特性合并的偶然。
serde_json = { version = "1", features = ["float_roundtrip"] }

[dev-dependencies]
toml = "0.8"
# ⚠ 快照测试按**真类型**构造那几份形状（本 crate 自己的 + `game` 的经济世界视图）：
# 快照逐字节钉着它们，而 `protocol_hash()` 就是那份快照的哈希 —— 抄一份"假的夹具"进测试，
# 等于把"形状变了 ⇒ 指纹变 ⇒ 握手续拒旧对端"这条门悄悄拆掉。
# ⚠ `game` 只依赖 serde ⇒ 一条叶子边，不可能成环。
game = { path = "../game" }
