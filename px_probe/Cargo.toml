[package]
name = "px_probe"
version = "0.1.0"
edition = "2024"

# 探针不是测试：它有 GPU、要几分钟、退出码才是判据（§47）。
# 所以它不进 workspace 的 default-members，`cargo test` 不会碰它。
[dependencies]
px_render = { path = "../px_render" }
px_verify = { path = "../px_verify" }
# 绑定组编号与渲染器**同一份来源**（契约表 `px_protocol::material`）：探针不再自己写死 2。
px_protocol = { path = "../px_protocol" }
# 参数块的**布局**也来自契约：`params.rs` 反射 `clouds.wgsl` 自己声明的结构体，
# 探针那份 `CloudParams` 只剩「值」（原来它是一份手抄的字节镜像，§69 S2）。
px_shader = { path = "../px_shader" }
wgpu = "29"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
