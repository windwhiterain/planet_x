[package]
name = "px_probe"
version = "0.1.0"
edition = "2024"

# ⚠ 探针不是测试：它有 GPU、要几分钟、退出码才是判据（§47）⇒ 与 `px_render` 一样
# **不在 `default-members`**，默认 `cargo test` 不碰它（`cargo test --workspace` 才跑到）。
[dependencies]
px_gpu = { path = "../px_gpu" }
# ⚠ **不依赖任何宿主 crate**（S8-a 之前它只为了 `px_render::shaders::assemble` 而依赖 bevy 宿主）。
# 现在它要的两样都在共享叶子 crate `px_shader` 里：路径约定（`workspace_roots` /
# `workspace_source_of`）与**裸 wgpu 宿主那张桩表**（`host_stubs::wgpu_host_stub`，
# 宿主那侧 `px_render::stubs` 只是 `pub use` 同一份 ⇒ "探针编的文本"与"宿主编的文本"
# 由**文本同源**保证，不是由 crate 依赖保证）。宿主 crate 也依赖不到：它只有 bin target。
px_shader = { path = "../px_shader" }
px_verify = { path = "../px_verify" }
# 绑定组编号与渲染器**同一份来源**（契约表 `px_protocol::material`）：探针不再自己写死 2。
px_protocol = { path = "../px_protocol" }
# 参数块的**布局**也来自契约：`params.rs` 反射 `clouds.wgsl` 自己声明的结构体，
# 探针那份 `CloudParams` 只剩「值」（原来它是一份手抄的字节镜像，§69 S2）。
# ⚠ 与 `px_gpu` / `px_render` / `px_pass` 逐字同一档：**只有 Vulkan**
#   （缺省特性会把 dx12 / metal / gles / webgpu 全拉回来，而那是已经否决过的后端）。
wgpu = { version = "29", default-features = false, features = ["vulkan", "wgsl"] }
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
# ⚠ `seam_probe` 用：读一份烘好的体网格 `.pxart`（`px_protocol::stream`），
#   再用**真源**的 `px_volume_alg::sample_volume` 量它的跨面折痕 —— 探针只搬几何与差分，
#   重建那一份**不复制**（复制出来的就是"量自己的抄本"）。
px_volume_schema = { path = "../px_volume_schema" }
px_volume_alg = { path = "../px_volume_alg" }
# sphere_probe 用：实验走**GPU**那条路（与图脚本同一份实现，CPU 那份只用于对账）
px_volume_gpu_op = { path = "../px_volume_gpu_op" }
# ⚠ `star_probe` 用：统一稀疏格那一份（星场载荷 + 索引）+ **按 `art/*.toml` 读参数**
#   （探针不许在源码里抄一份星场参数 —— 抄一份就是"量的是另一份星场"）。
px_sparse = { path = "../px_sparse" }
px_graph = { path = "../px_graph" }
# ⚠ 读盘上那份产物要 `Build::decode`（编解码那一半住契约层：`px_graph_schema::build`）。
px_graph_schema = { path = "../px_graph_schema" }
toml = "0.8"
# sphere_probe 用：写 PNG（渲染器 shot::write_png 用的是同一套 image crate）
image = "0.25"

