[package]
name = "px_probe"
version = "0.1.0"
edition = "2024"

# 探针不是测试：它有 GPU、要几分钟、退出码才是判据（§47）。
# 所以它不进 workspace 的 default-members，`cargo test` 不会碰它。
[dependencies]
px_render = { path = "../px_render" }
px_verify = { path = "../px_verify" }
wgpu = "29"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
encase = "0.12"
# 云参数的镜像（`src/params.rs`）里有 `vec4<f32>` 那两格：encase 对 glam 的实现就在 glam 这边
# （`glam/impl_encase.rs`，靠 `encase` 这个 feature 打开）。版本与 bevy_math 那份一致。
glam = { version = "0.32", features = ["encase"] }
