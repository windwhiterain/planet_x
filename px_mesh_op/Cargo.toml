[package]
name = "px_mesh_op"
version = "0.1.0"
edition = "2024"

# ⚠ **只有 dylib**：这一份是**运行时按身份装载**的实现库（`px_graph_schema::ops`），
#   不是任何人的 cargo 依赖 —— 一旦被图程序依赖，"改一行实现不重编图程序"就没了
#   （那条性质由 `px_graphs/tests/crate_graph.rs` 看着）。
[lib]
crate-type = ["dylib"]

[dependencies]
# 契约（`PxOp` / 装载 / `Build`）+ 网格域的数据与**声明**（算法不吃声明，但符号签名要用它）。
px_graph_schema = { path = "../px_graph_schema" }
px_mesh_schema = { path = "../px_mesh_schema" }
# ⚠ 它读体积载荷的**参数空间约定**（`VolumeGrid` 只在同一个面内插值）：换掉采样器会把面缝焊法换掉。
px_volume_schema = { path = "../px_volume_schema" }
# 立方球那一路的输入就是一张场。
px_field_schema = { path = "../px_field_schema" }
# 线格式类型（`MeshData` / 立方球的采样约定）：算法直接用它。
px_protocol = { path = "../px_protocol" }
isosurface = "=0.1.0-alpha.0"

[build-dependencies]
# 源码指纹（身份的那一半：进键的"实现是哪一份"）用它，与键里的哈希同一个算法。
px_fingerprint = { path = "../px_fingerprint" }
