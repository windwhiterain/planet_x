[package]
name = "px_gpu"
version = "0.0.0"
edition = "2024"

[dependencies]
# ⚠ **必须 `default-features = false` 并显式点名后端**：wgpu 29 的缺省特性是
#   `std + parking_lot + dx12 + metal + gles + vulkan + wgsl + webgpu`
#   —— 那等于把本仓已经否决过的后端（metal / gles / webgpu；§104 第 9 条）全部拉回来。
#   与 `px_render` / `px_pass` 逐字同一档：**只有 Vulkan**（外加编译 WGSL 要的 `wgsl`）。
#   ⚠ 从前这里是裸 `wgpu = "29"`，而且 `backends()` 的缺省是 DX12 ⇒ **烘图（算子 dylib 走
#   `px_gpu::connect`）与出图（`px_render` 编译期锁 Vulkan）跑在两个后端上**，正是本仓
#   最忌的"量的不是被测物"。现在两处都归到 Vulkan。
wgpu = { version = "29", default-features = false, features = ["vulkan", "wgsl"] }
pollster = "0.4"
