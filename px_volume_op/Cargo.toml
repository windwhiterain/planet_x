[package]
name = "px_volume_op"
version = "0.1.0"
edition = "2024"

# ⚠ **只有 dylib**：这一份是**运行时按身份装载**的实现库（`px_graph_schema::ops`），
#   不是任何人的 cargo 依赖 —— 一旦被图程序依赖，"改一行实现不重编图程序"就没了
#   （那条性质由 `px_graphs/tests/crate_graph.rs` 看着）。
[lib]
crate-type = ["dylib"]

[dependencies]
px_volume_gpu_op = { path = "../px_volume_gpu_op" }
# 契约（`PxOp` / 装载 / `Build`）+ 体积域的数据与**声明**（算法不吃声明，但符号签名要用它）。
px_graph_schema = { path = "../px_graph_schema" }
px_volume_schema = { path = "../px_volume_schema" }
# 算子的输入就是一张场（`px_body!` 展开出来的签名里就是它）。
px_field_schema = { path = "../px_field_schema" }
# 星场的载荷类型（`px_sparse::StarField`）：`cloud.emission` 与 `sky.nebula` 两个壳的
# 签名里都有它（星是 R3 里的点光源，不再是协议层的一张立方图）。
px_sparse = { path = "../px_sparse" }
# ⚠ **算法在这里**（rlib）：这一份壳只把它接到声明上。搬出去的理由见 `src/lib.rs` 顶上那条。
px_volume_alg = { path = "../px_volume_alg" }

[build-dependencies]
# 源码指纹（身份的那一半：进键的"实现是哪一份"）用它，与键里的哈希同一个算法。
px_fingerprint = { path = "../px_fingerprint" }
