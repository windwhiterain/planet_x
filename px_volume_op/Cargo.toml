[package]
name = "px_volume_op"
version = "0.1.0"
edition = "2024"

[lib]
# ⚠ `rlib` 这一项是给**生成的单态化实例**用的：它静态链本 crate 的那一份，
# 于是生成的 dylib **一个 Rust 上游 DLL 都不需要**（只带系统库）。
# 老路径（驱动装载的那一份）用的仍然是 `dylib`，两不干扰。
# ⚠ **只要 rlib**：算子现在是图程序**静态链**进来的一个 Rust 库。
#   从前那个 `dylib` 是给"驱动按描述符表装载"用的，那条路已经删掉
#   （连同描述符、OpTable、loader、生成的单态化实例）。
crate-type = ["rlib"]

[dependencies]
# 图参数 struct 的 `PxInputs` 由它生成（字段名进键、按位置解字节）。
px_derive = { path = "../px_derive" }
px_protocol = { path = "../px_protocol" }
px_graph_schema = { path = "../px_graph_schema" }
px_field_schema = { path = "../px_field_schema" }
px_volume_schema = { path = "../px_volume_schema" }
# 参照场那一侧：烘出来的粗场要能与它逐位对上（§28.2 的共享依赖）。
px_verify = { path = "../px_verify" }
# ⚠ 类型化契约那一层（`src/typed.rs`）：图脚本静态链接的是**它**，不是本 crate 的 dylib。
px_cook = { path = "../px_cook" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[build-dependencies]
#  里的源码指纹用它（与键里的哈希同一个算法）。
blake3 = "1"
