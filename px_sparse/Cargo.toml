[package]
name = "px_sparse"
version = "0.1.0"
edition = "2024"

# ⚠ **rlib**：它是**数据结构**（索引 + 遍历语义），不是被装载的实现库，也不是载荷本身。
#   载荷类型（星场；体素那一档将来也住这里）与它们的 `Build` 实现都在这一层
#   ——"载荷编解码与载荷类型住一起"那条口径（见 `px_graph_schema::build` 的文件头）。
[dependencies]
# 线格式（`Blob` / `DType`）。
px_protocol = { path = "../px_protocol" }
# **烘图契约**（`Build`）：载荷的编解码那一半住契约层（用户 2026-09-27 的裁定），
# 而实现跟着**自己的载荷类型**走 ⇒ 这一层为了给自己的星场写 `impl Build` 而依赖它。
# ⚠ 这一条边不会成环：`px_graph_schema` 只依赖线格式那一层。
px_graph_schema = { path = "../px_graph_schema" }
