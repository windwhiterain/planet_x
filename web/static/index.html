<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>行星X · WebUI</title>
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <!-- 全屏 3D 地图：铺满整个视口，UI 靠边缘的 bar 手动展开 -->
  <div id="map"></div>

  <!-- 顶部边缘 bar：回合/种子/推进/重建（默认收起） -->
  <button id="toggleTop" class="edge-toggle top" title="展开/收起顶部控制" data-closed-arrow="▼" data-open-arrow="▲">▼</button>
  <header id="topbar" class="edge-panel top">
    <h1>行星X <span class="sub">太空沙盘 · WebUI</span></h1>
    <div class="bar">
      <span id="metaRound">回合 0 · 0 个月</span>
      <label>推进
        <select id="advanceN">
          <option value="1">1</option>
          <option value="5">5</option>
          <option value="20">20</option>
        </select>
      </label>
      <button id="advanceBtn">▶ 推进</button>
      <label class="inp">种子 <input id="seedInput" placeholder="random" /></label>
      <button id="newBtn">↺ 重建</button>
      <span id="status"></span>
    </div>
  </header>

  <!-- 左侧边缘 bar：控制层级树 + 应用（默认收起） -->
  <button id="toggleSide" class="edge-toggle left" title="展开/收起控制层级" data-closed-arrow="▶" data-open-arrow="◀">▶</button>
  <aside id="side" class="edge-panel left">
    <div class="panel" id="treePanel">
      <h2>控制层级 <span class="hint">全局 · 势力 · 天体 · 城市 · 叶片</span></h2>
      <div id="tree"></div>
    </div>
    <button id="applyBtn" class="primary">✓ 应用到服务器</button>
  </aside>

  <!-- 底部边缘 bar：选中读面 + 回合 diff（默认收起） -->
  <button id="toggleDiff" class="edge-toggle bottom" title="展开/收起状态" data-closed-arrow="▲" data-open-arrow="▼">▲</button>
  <footer id="diffBar" class="edge-panel bottom">
    <div id="readout"></div>
    <div id="diffText"></div>
  </footer>

  <script type="module" src="map3d.js"></script>
  <script src="app.js"></script>
</body>
</html>
