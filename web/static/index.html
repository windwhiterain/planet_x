<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>行星X · WebUI</title>
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <!-- 全屏 3D 地图：铺满整个视口，UI 靠边缘的 bar 手动展开 -->
  <div id="map"></div>

  <!-- 顶部边缘 bar：回合/种子/推进/重建（默认收起） -->
  <button id="toggleTop" class="edge-toggle top" title="展开/收起顶部控制" data-closed-arrow="▼" data-open-arrow="▲">▼</button>
  <header id="topbar" class="edge-panel top">
    <h1>行星X <span class="sub">太空沙盘 · WebUI</span></h1>
    <div class="bar">
      <span id="metaRound">回合 0 · 0 个月</span>
      <label>推进
        <select id="advanceN">
          <option value="1">1</option>
          <option value="5">5</option>
          <option value="20">20</option>
        </select>
      </label>
      <button id="advanceBtn">▶ 推进</button>
      <label class="inp">种子 <input id="seedInput" placeholder="random" /></label>
      <button id="newBtn">↺ 重建</button>
      <span id="status"></span>
    </div>
    <!-- 「本回合」一句话：推进之后人类至少要知道「刚刚发生了什么」。
         只报事实（事件计数 + 类型 + 最新故事节拍），不做阈值判断。 -->
    <div class="bar"><span id="nowLine" class="now-line"></span></div>
  </header>

  <!-- 左侧边缘 bar：**两个模式**——
         · 「读面」= 组织点声明出来的视图（views.json + specview.js，可读的整理过的人类视图）
         · 「控制」= 写面（手写的控制树，可编辑、可回传 diff）
       默认开在读面：人类每回合先看的是「发生了什么」，不是「我能改哪些叶」。 -->
  <button id="toggleSide" class="edge-toggle left" title="展开/收起左栏（读面 / 控制）" data-closed-arrow="▶" data-open-arrow="◀">▶</button>
  <aside id="side" class="edge-panel left">
    <div class="tnode-tabs" id="sideTabs">
      <span class="tnode-tab sel" data-mode="read">读面</span>
      <span class="tnode-tab" data-mode="control">控制</span>
    </div>
    <div class="panel" id="readPanel">
      <div class="tnode-tabs" id="readTabs"></div>
      <div id="readBody" class="sv-scroll"></div>
    </div>
    <div class="panel" id="treePanel" style="display:none">
      <h2>控制层级 <span class="hint">全局 · 势力 · 天体 · 城市 · 设计图 · 叶片</span></h2>
      <div id="tree"></div>
    </div>
    <!-- 「应用到服务器」＋它的**回执**：两者钉在面板底部（`position: sticky`）——以前
         按钮会随长树滚出视口（读面 bar 展开时还点不动），而回执更必须在**你刚点完**的地方。
         引擎实际做了什么：落地几片叶、拒了哪些、为什么。静默吞掉丢弃就是「失败看起来像成功」
         ——设计图那几条守卫（blueprint_class_mismatch / duplicate_component /
         too_many_components）就靠这一块显示出来，而不是被吞掉。 -->
    <div class="side-foot">
      <div id="report" class="api-report"></div>
      <button id="applyBtn" class="primary">✓ 应用到服务器</button>
    </div>
  </aside>

  <!-- 底部边缘 bar：**选中对象读面**（组织点卡片 + 其余字段，没组织点就退回 generic widget）
       + 回合 diff（默认收起）。在地图上点天体/城/舰、或点左栏读面里的名字，这里显示该对象。 -->
  <button id="toggleDiff" class="edge-toggle bottom" title="展开/收起选中读面" data-closed-arrow="▲" data-open-arrow="▼">▲</button>
  <footer id="diffBar" class="edge-panel bottom">
    <div class="sel-bar">
      <span id="selHead"></span>
      <span id="diffText"></span>
    </div>
    <div id="readout" class="jv-scroll"></div>
  </footer>

  <!-- 右侧边缘 bar：**普通 state 全量信息**（只读，默认收起）。
       左栏是「整理过的读面 + 可编辑的控制面」；右侧是同一份世界的**原始读数**：
       天体/定居点/城/建筑/势力/舰/事件/编年史 + 本回合派生态 + 全部配置表。
       由 jsonview.js 这个 schema-agnostic widget 渲染——它不认识任何字段名，只认
       JSON 形状，所以 state 结构怎么改都不用动前端。被组织点认领的集合会**就地**换成
       整理后的表（每行仍带「其余字段」），没被认领的部分照旧通用渲染。 -->
  <button id="toggleInfo" class="edge-toggle right" title="展开/收起状态" data-closed-arrow="◀" data-open-arrow="▶">◀</button>
  <aside id="info" class="edge-panel right">
    <div class="panel" id="infoPanel">
      <h2>状态 <span class="hint">普通 state · 派生 · 配置（只读）</span></h2>
      <div class="jv-toolbar">
        <input id="jvFilter" placeholder="过滤（键名 / 值）" />
        <button id="jvExpand" title="展开当前根的全部可折叠节点">全展开</button>
        <button id="jvCollapse" title="收起当前根的全部可折叠节点">全收起</button>
      </div>
      <div id="jvTabs" class="tnode-tabs"></div>
      <div id="jvBody" class="jv-scroll"></div>
    </div>
  </aside>

  <script type="module" src="map3d.js"></script>
  <script src="jsonview.js"></script>
  <script src="specview.js"></script>
  <script src="app.js"></script>
</body>
</html>
