[package]
name = "px_host_protocol"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
# ⚠ `float_roundtrip` **必须开**：默认的浮点解析不是正确舍入的，于是
# "读进来再写回去"不是恒等（实测 `0.11999999731779099` 会读成 +1 ulp 的值）。
# 本仓库的判据是逐字节的，读不出写进去的东西就是缺陷 —— 代价是浮点解析约 2×，
# 而文档只有几 KB。凡是解这份 JSON 的 crate 都自己写一遍：别靠特性合并的偶然。
serde_json = { version = "1", features = ["float_roundtrip"] }
# ⚠ **只许有这一条**，而且它是叶子：`frame.rs` 的信封要 `ProtocolId` 与 `wire` 的文本编码，
# `render.rs` 的 `Lease::matches` 要按 `ProtocolId` 比指纹 —— 抄一份到这里就是让"协议有
# 几个名字"重新变成两处会漂开的默认值。
# ⚠ 这里**不许**依赖 `px_protocol`：那会让 `px_protocol`(dev) → 本 crate → `px_protocol`
# 成一条 dev 环，而"`px_protocol` 只装 px-scene ⇄ px-pass 的交换"这条口径正是要拆掉它。
# 这也是握手身份与线格式被单独放进叶子 crate `px_handshake` 的原因。
px-handshake = { path = "../px_handshake" }
