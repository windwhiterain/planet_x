[package]
name = "px_volume_schema"
version = "0.1.0"
edition = "2024"

[dependencies]
# 超参数 struct 的 `PxKeyed` 由它生成（加字段自动进键）。
px_derive = { path = "../px_derive" }
blake3 = "1"
# 体积域的数据与参数（立方球参数空间约定 + 烘培参数）：没有算法、没有驱动。
px_protocol = { path = "../px_protocol" }
# 统一稀疏 R3 格（星场载荷住在这一层；体素那一档将来也搬过去）。
px_sparse = { path = "../px_sparse" }
px_graph_schema = { path = "../px_graph_schema" }
# ⚠ 算子的**输入**就是一张场（`ops.rs` 的 `CloudCoarseInput`），所以声明这一层要它。
px_field_schema = { path = "../px_field_schema" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
toml = "0.8"

[build-dependencies]
# `build.rs` 算**这一份声明**的源码指纹（`SOURCE_HASH`）：它是泛型实例的 key 的一半
# （`px_op!` 里那句 `DECL_HASH = env!("PX_SOURCE_HASH")`，见 `docs/system/generic-instances.md` §177 / §179.3）。
px_fingerprint = { path = "../px_fingerprint" }
