[package]
name = "px_volume_schema"
version = "0.1.0"
edition = "2024"

[dependencies]
# 体积域的数据与参数（立方球参数空间约定 + 烘培参数）：没有算法、没有驱动。
px_protocol = { path = "../px_protocol" }
px_graph_schema = { path = "../px_graph_schema" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
toml = "0.8"
