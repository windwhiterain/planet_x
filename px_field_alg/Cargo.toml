[package]
name = "px_field_alg"
version = "0.1.0"
edition = "2024"

# ⚠ **rlib**（默认，不写 `crate-type`）：它是**算法**，不是被装载的实现库。
#   场域的实现库是 `px_field_op`（dylib，薄壳），它把这门算法链进去；
#   泛型实例（`px_inst!`）链的是**同一份** rlib。
#
# ⚠ 为什么算法要单独一个 crate：泛型实例的 key 必须覆盖 alg crate 的源码名册
#   （`.agents/notes/art/19-generic-inst.md` §177），而名册要的是"这些文件"而不是"编译产物"；
#   算法如果住在 dylib crate 里，图侧就没有一个稳定的目录名册可收。

[dependencies]
# 契约（`PxOp` / `Build` 的类型）+ 场域的数据（`Field` / `Grid` / 参数）。
px_graph_schema = { path = "../px_graph_schema" }
px_field_schema = { path = "../px_field_schema" }

[build-dependencies]
# 源码指纹（身份的那一半：进键的"alg 是哪一份"）用它，与键里的哈希同一个算法。
px_fingerprint = { path = "../px_fingerprint" }
