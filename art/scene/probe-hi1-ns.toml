# 影边判据档：**环投到行星上**（`rings` 是唯一一条 `cast_shadow = true` 的壳，而它带着一条
# 真实的硬边 ⇒ "影边宽度"这个量在这里量得出来）。三档只差**太阳多远**：
# `probe-ringsun5` / `probe-ringsun20` 把灯位按 ×5 / ×20 拉开，强度按距离平方同步放大
# （`I/d²` 三档相同）⇒ 落到行星上的辐照不变，**唯一变量是灯的距离**。
#
# 为什么需要它：`orbit-bare-shadow` 那一份只有一颗行星，没有第二个投影体 ⇒
# "影边宽度"在那里量不出来（那里验的是"自影不再随距离劣化"）。
name = "probe-hi1-ns"
ambient = 80.0
cameras = "review"

[[parts]]
id = "planet"
kind = "planet"
shader = "surface"
graph = "planet"
members = { height = "height", mesh = "surface", shader = "shaders::surface" }
params = { palette = "rocky", displace = 0.06, sea_level = 0.52, radius = 1.0, spin = 0.0, rings = 3.0, shadows = 0, shadow_density = 256, light_position = [-4.2, 9.0, 2.35], light_intensity = 7.6e5 }

[[parts]]
id = "atmosphere"
kind = "atmosphere"
shader = "atmosphere"
graph = "shaders"
members = { shader = "atmosphere" }
params = { inner = 1.0, outer = 1.14, density = 0.3, softness = 0.5, tint = [0.44, 0.64, 0.98] }