# 消融档：与 orbit-soft 只差 planet part 的 `shadows = 0`（整条 shadow map 关掉）。
# 判据：这一对之间的差**只有**两样东西 —— 山自阴影（地表）与云收到的"别人的影"（云）。
# 所以它同时是「云收影」这一项唯一的对照（云那边没有单独的开关：
# 贴图为空时 `fetch_directional_shadow` 自己返回 1.0）。
#
# 与 orbit-soft 的差别就这一个参数（别的一个字节都不许差），否则配对就没意义了。
#
# 烘：cargo run -p px_graphs --bin scene orbit-soft-noshadow

name = "orbit-soft-noshadow"
ambient = 80.0
cameras = "review"

[[parts]]
id = "planet"
kind = "planet"
shader = "surface"
graph = "planet"
members = { height = "height", mesh = "surface", shader = "shaders::surface" }
params = { palette = "rocky", displace = 0.06, sea_level = 0.52, radius = 1.0, spin = 0.0, rings = 0.0, shadows = 0, cloud_shadow = 1.0, shadow_height = 0.5 }

[[parts]]
id = "clouds"
kind = "clouds"
shader = "clouds"
graph = "clouds"
members = { shader = "shaders::clouds", field = "mixed", slope_x = "slope_x", slope_y = "slope_y", slope_z = "slope_z" }
params = { gradient = 2, surface_level = 0.20, inner = 1.01, outer = 1.06, extinction = 1400.0, coverage = 0.35, base = 0.06, top = 0.62, detail_scale = 16.0, detail_strength = 0.55, erode = 0.0, phase = 0.62, shadow = 1.0, steps = 56, bump = 0.85, seed = 7, slope_scale = 0.12, taper = 0.45, coverage_gain = 2.6 }

[[parts]]
id = "atmosphere"
kind = "atmosphere"
shader = "atmosphere"
graph = "shaders"
members = { shader = "atmosphere" }
params = { inner = 1.0, outer = 1.14, density = 0.3, softness = 0.5, tint = [0.44, 0.64, 0.98] }
