# `orbit-bare` ＋ **没有灯**：S2 的判据档。
#
# S2 要验的是"网格 + 通用材质 + 参数打包"，**不许混进灯**。
# 做法是把强度给 0，而不是把 `lights` 数组清空 —— 因为灯是烘图侧从 planet part 的
# 参数里生成的（`px_graphs/src/bin/scene.rs` 的 `number_or("light_intensity", 7.6e5)`），
# 场景文档里的一盏灯是"有一个颜色 × 强度"的对象，给 0 强度才是**内容上真的没有光**。
#
# `px_render/assets/shaders/light.wgsl` 判"这盏灯有没有亮"看的是**颜色**：
# `lit = !all(color_inverse_square_range.rgb == vec3(0.0))` ⇒ 强度 0 ⇒ `lit = false`
# ⇒ `sun_light()` 返回 color 0、point 0、shadow_maps 0 ⇒ 着色里一点直射光都不参与。
#
# ⚠ **环境光留着**（`ambient = 80`，与 orbit-bare 相同）——这一条是有意的：
# 把环境光也关掉的话整幅图会几乎全黑，PNG 压得极小，**任何错误看起来都还是黑的**，
# 那是一条几乎没有分辨力的判据。留着环境光，画面是"平的受光面 + 星空盒"，
# 网格、材质、参数打包错了都看得出来。
#
# 烘：cargo run -p px_graphs --bin scene orbit-bare-nolight

name = "orbit-bare-nolight"
ambient = 80.0
cameras = "review"

[[parts]]
id = "planet"
kind = "planet"
shader = "surface"
graph = "planet"
members = { height = "height", mesh = "surface", shader = "shaders::surface" }
params = { palette = "rocky", displace = 0.06, sea_level = 0.52, radius = 1.0, spin = 0.0, rings = 0.0, light_intensity = 0 }

[[parts]]
id = "atmosphere"
kind = "atmosphere"
shader = "atmosphere"
graph = "shaders"
members = { shader = "atmosphere" }
params = { inner = 1.0, outer = 1.14, density = 0.3, softness = 0.5, tint = [0.44, 0.64, 0.98] }
