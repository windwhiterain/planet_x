# 代理几何当内容：与 orbit-surface.toml **只差** clouds part 多一个 `proxy` 成员。
#
# 云的几何从 `ico(64)` 球壳换成烘出来的代理 mesh（`clouds` 图的 `proxy` 节点）：
# 空区域在光栅阶段就被剔除，剩下的 fragment 只决定从哪个下标开始扫 —— 步进栅格
# 仍锚在壳的入射点上（绝对），所以外观必须与 orbit-surface 逐字节相同。
#
# 烘：cargo run -p px_graphs --bin scene orbit-proxy

name = "orbit-proxy"
ambient = 80.0
cameras = "review"

[[parts]]
id = "planet"
kind = "planet"
shader = "surface"
graph = "planet"
members = { height = "height", mesh = "surface", shader = "shaders::surface" }
params = { palette = "rocky", displace = 0.06, sea_level = 0.52, radius = 1.0, spin = 0.0, rings = 0.0 }

[[parts]]
id = "clouds"
kind = "clouds"
shader = "clouds"
graph = "clouds"
members = { shader = "shaders::clouds", field = "mixed", slope_x = "slope_x", slope_y = "slope_y", slope_z = "slope_z", proxy = "clouds::proxy" }
params = { ablate = "surface", inner = 1.01, outer = 1.06, extinction = 900.0, coverage = 0.35, base = 0.06, top = 0.62, detail_scale = 16.0, detail_strength = 0.55, erode = 0.0, phase = 0.62, shadow = 1.0, steps = 56, bump = 0.85, seed = 7, slope_scale = 0.12, taper = 0.45, coverage_gain = 2.6 }

[[parts]]
id = "atmosphere"
kind = "atmosphere"
shader = "atmosphere"
graph = "shaders"
members = { shader = "atmosphere" }
params = { inner = 1.0, outer = 1.14, density = 0.3, softness = 0.5, tint = [0.44, 0.64, 0.98] }
