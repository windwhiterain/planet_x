# 真场代理 + 上界早退：与 orbit-proxy-fine.toml **只差 `bound = 1`**。
#
# `bound` 只对「粗场都不超阈」的步生效，而那批步在代理档里已经因为 fragment 不存在而不存在
# ⇒ 上一段的实测是两者收益不叠加（coarse 版 47.06 → 36.43）。真场代理把步数压到个位数之后
# bound 还能剩多少，要重新量 —— 这一份就是那个组合。
#
# 烘：cargo run -p px_graphs --bin scene orbit-proxy-fine-bound

name = "orbit-proxy-fine-bound"
ambient = 80.0
cameras = "review"

[[parts]]
id = "planet"
kind = "planet"
shader = "surface"
graph = "planet"
members = { height = "height", mesh = "surface", shader = "shaders::surface" }
params = { palette = "rocky", displace = 0.06, sea_level = 0.52, radius = 1.0, spin = 0.0, rings = 0.0 }

[[parts]]
id = "clouds"
kind = "clouds"
shader = "clouds"
graph = "clouds"
members = { shader = "shaders::clouds", field = "mixed", slope_x = "slope_x", slope_y = "slope_y", slope_z = "slope_z", proxy = "clouds::proxy_fine" }
params = { ablate = "surface", bound = 1, inner = 1.01, outer = 1.06, extinction = 900.0, coverage = 0.35, base = 0.06, top = 0.62, detail_scale = 16.0, detail_strength = 0.55, erode = 0.0, phase = 0.62, shadow = 1.0, steps = 56, bump = 0.85, seed = 7, slope_scale = 0.12, taper = 0.45, coverage_gain = 2.6 }

[[parts]]
id = "atmosphere"
kind = "atmosphere"
shader = "atmosphere"
graph = "shaders"
members = { shader = "atmosphere" }
params = { inner = 1.0, outer = 1.14, density = 0.3, softness = 0.5, tint = [0.44, 0.64, 0.98] }
