# §51.4 第一条（保守上界早退）的对照场景：与 orbit-surface.toml **只差 `bound = 1`**。
#
# `bound = 1` 让 `cloud_field` 先拿 `shape_of(cover, altitude, 1.0)` 这个精确上界比
# `surface_level`：够不着就直接 0.0。硬表面步进只问「> surface_level」，所以这条早退
# 不该改变任何像素 —— 逐字节判据就是拿这一份对 orbit-surface。
#
# 烘：cargo run -p px_graphs --bin scene orbit-bound

name = "orbit-bound"
ambient = 80.0
cameras = "review"

[[parts]]
id = "planet"
kind = "planet"
shader = "surface"
graph = "planet"
members = { height = "height", mesh = "surface", shader = "shaders::surface" }
params = { palette = "rocky", displace = 0.06, sea_level = 0.52, radius = 1.0, spin = 0.0, rings = 0.0 }

[[parts]]
id = "clouds"
kind = "clouds"
shader = "clouds"
graph = "clouds"
members = { shader = "shaders::clouds", field = "mixed", slope_x = "slope_x", slope_y = "slope_y", slope_z = "slope_z" }
params = { ablate = "surface", bound = 1, inner = 1.01, outer = 1.06, extinction = 900.0, coverage = 0.35, base = 0.06, top = 0.62, detail_scale = 16.0, detail_strength = 0.55, erode = 0.0, phase = 0.62, shadow = 1.0, steps = 56, bump = 0.85, seed = 7, slope_scale = 0.12, taper = 0.45, coverage_gain = 2.6 }

[[parts]]
id = "atmosphere"
kind = "atmosphere"
shader = "atmosphere"
graph = "shaders"
members = { shader = "atmosphere" }
params = { inner = 1.0, outer = 1.14, density = 0.3, softness = 0.5, tint = [0.44, 0.64, 0.98] }
