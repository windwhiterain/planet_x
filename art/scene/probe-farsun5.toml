# `orbit-bare` ＋ **影子**：S3 的判据档。
#
# 为什么要单独一份，而不是直接拿 orbit-bare 当判据：`orbit-bare` 的 planet part
# 没有 `shadows` 键 ⇒ `px_graphs` 里那句 `sun.shadows = number_or("shadows", 0.0) > 0.5`
# 判成 false ⇒ `sun_light()` 给出 `shadow_maps = 0` ⇒
# `surface.wgsl` 里那句 `fetch_point_shadow` **根本不会被调用**，cube 影子图连建都不建。
# 于是"orbit-bare 逐字节相同"这条判据**碰不到**影子那一整套（§104 第 2 条、§109.3）。
#
# 这一份与 `orbit-bare` 的差别**只有** planet part 上多一个 `shadows = 1`：
# 场景内容一模一样（行星 + 大气 + 一盏点光 + 星空盒，**没有云** —— 所以不违反
# §107「S3 之前别碰云」），但这一份会**真的**渲染 6 面 cube 影子图并采样它。
#
# ⚠ 两份场景产物的键不同（参数不同 ⇒ 内容不同）⇒ **不会**动 S-1 那五格锚。
#
# 烘：cargo run -p px_graphs --bin scene orbit-bare-shadow

name = "probe-farsun5"
ambient = 80.0
cameras = "review"

[[parts]]
id = "planet"
kind = "planet"
shader = "surface"
graph = "planet"
members = { height = "height", mesh = "surface", shader = "shaders::surface" }
params = { palette = "rocky", displace = 0.06, sea_level = 0.52, radius = 1.0, spin = 0.0, rings = 0.0, shadows = 1, light_position = [-21.0, 5.75, 11.75], light_intensity = 1.9e7 }

[[parts]]
id = "atmosphere"
kind = "atmosphere"
shader = "atmosphere"
graph = "shaders"
members = { shader = "atmosphere" }
params = { inner = 1.0, outer = 1.14, density = 0.3, softness = 0.5, tint = [0.44, 0.64, 0.98] }
