# 场景配方：软云档 ＋ **细节风**（§61）。
#
# 与 orbit-soft 只差 clouds part 的两个参数：`wind` / `wind_skin`（两层细节风的幅度）。
# 时间来自 shader 内的 `globals.time`（Bevy 的 Globals uniform，渲染侧每帧自己写）——
# **不经逻辑帧注入**，所以这个场景每出一次图都不一样（风在动）：
# 「同一场景两次出图逐字节相同」那条判据在这个场景上**不成立**，评测/对照请用
# 不带动画的 `orbit-soft`（两个参数缺省 0）。
#
# 两层的时间尺度不同（写在 WGSL 里，约 48 s 与 17 s）⇒ 细的那层在粗的那层上滑过去，
# 看起来是翻涌/搓动，而不是整块平移。幅度是"方向单位"，0.15 大约是把细节在球面上
# 推 ±8.6°。
#
# 烘：cargo run -p px_graphs --bin scene orbit-soft-wind

name = "orbit-soft-wind"
ambient = 80.0
cameras = "review"

[[parts]]
id = "planet"
kind = "planet"
shader = "surface"
graph = "planet"
members = { height = "height", mesh = "surface", shader = "shaders::surface" }
params = { palette = "rocky", displace = 0.06, sea_level = 0.52, radius = 1.0, spin = 0.0, rings = 0.0, shadows = 1, cloud_shadow = 1.0, shadow_height = 0.5 }

[[parts]]
id = "clouds"
kind = "clouds"
shader = "clouds"
graph = "clouds"
members = { shader = "shaders::clouds", field = "mixed", slope_x = "slope_x", slope_y = "slope_y", slope_z = "slope_z" }
params = { gradient = 2, surface_level = 0.20, inner = 1.01, outer = 1.06, extinction = 1400.0, coverage = 0.35, base = 0.06, top = 0.62, detail_scale = 16.0, detail_strength = 0.55, erode = 0.0, phase = 0.62, shadow = 1.0, steps = 56, bump = 0.85, seed = 7, slope_scale = 0.12, taper = 0.45, coverage_gain = 2.6, wind = 0.15, wind_skin = -0.26 }

[[parts]]
id = "atmosphere"
kind = "atmosphere"
shader = "atmosphere"
graph = "shaders"
members = { shader = "atmosphere" }
params = { inner = 1.0, outer = 1.14, density = 0.3, softness = 0.5, tint = [0.44, 0.64, 0.98] }
