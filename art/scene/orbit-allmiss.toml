# §51.4 第三条（全 miss 的步进代价）的对照场景：与 orbit-surface.toml **只差
# `surface_level = 10.0`**。
#
# `cloud_field` 的最大值约 0.82（`shape_of` 的返回值被 clamp 在 [0,1]，而这个场景的
# 覆盖度/形状参数到不了 1），阈值给到 10 ⇒ 每个进入硬表面分支的像素都走满 56 步、
# 一个都不命中、然后 discard。它就是「找面白走的那 56 步」的上界。
#
# 烘：cargo run -p px_graphs --bin scene orbit-allmiss

name = "orbit-allmiss"
ambient = 80.0
cameras = "review"

[[parts]]
id = "planet"
kind = "planet"
shader = "surface"
graph = "planet"
members = { height = "height", mesh = "surface", shader = "shaders::surface" }
params = { palette = "rocky", displace = 0.06, sea_level = 0.52, radius = 1.0, spin = 0.0, rings = 0.0 }

[[parts]]
id = "clouds"
kind = "clouds"
shader = "clouds"
graph = "clouds"
members = { shader = "shaders::clouds", field = "mixed", slope_x = "slope_x", slope_y = "slope_y", slope_z = "slope_z" }
params = { ablate = "surface", surface_level = 10.0, inner = 1.01, outer = 1.06, extinction = 900.0, coverage = 0.35, base = 0.06, top = 0.62, detail_scale = 16.0, detail_strength = 0.55, erode = 0.0, phase = 0.62, shadow = 1.0, steps = 56, bump = 0.85, seed = 7, slope_scale = 0.12, taper = 0.45, coverage_gain = 2.6 }

[[parts]]
id = "atmosphere"
kind = "atmosphere"
shader = "atmosphere"
graph = "shaders"
members = { shader = "atmosphere" }
params = { inner = 1.0, outer = 1.14, density = 0.3, softness = 0.5, tint = [0.44, 0.64, 0.98] }
