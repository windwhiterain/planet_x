# 场景配方：软云档，**没有**代理几何、**没有**上界早退（= §63 之前那一版 orbit-soft 的内容）。
#
# 与 orbit.toml 的差别**只有** clouds part 里那几个参数 ＋ planet part 上那三个新旋钮：
# `gradient = 2` 是档位开关 —— 软档**每一步**都算这一步自己的法线（N·L 当自阴影），
# 并把密度按等值面做一次凹重映射 ⇒ 轮廓是软的（斜率为 0 的爬升）、体内是实的。
# 老场景的 gradient 是缺省 1（只有硬表面那条路读它）⇒ 一个像素都不变。
#
# 表面那三个（planet part）：
#   shadows = 1        场景里的平行光开 shadow map ⇒ 山自阴影、环影落到行星与云上
#   cloud_shadow = 1.0 云影落在表面的强度（0 = 关）—— 表面材质按「指定高度」查云覆盖度立方图
#   shadow_height = 0.5 「指定高度」h：太阳光线打在云带的哪一层（0 = 云底、1 = 云顶）
#
# 软档的三个云旋钮：gradient（档位）、surface_level（等值面高度，与硬表面同一个 cloud surface）、
# shadow（自阴影强度：N·L 的指数）、extinction（不透明度）。
#
# 为什么留着它（§63）：几何是 `ico(64)` 球壳 ⇒ 空区域的 fragment 也要走满步进。
# `orbit-soft` = 这一份 ＋ 代理（`proxy` 成员）＋ 早退（`bound = 1`，逐字节不变）；
# `orbit-soft-proxy` = 这一份 ＋ 代理。要单独量"代理值多少"就用它对 `orbit-soft-proxy`。
#
# 烘：cargo run -p px_graphs --bin scene orbit-soft-shell

name = "orbit-soft-shell"
ambient = 80.0
cameras = "review"

[[parts]]
id = "planet"
kind = "planet"
shader = "surface"
graph = "planet"
members = { height = "height", mesh = "surface", shader = "shaders::surface" }
params = { palette = "rocky", displace = 0.06, sea_level = 0.52, radius = 1.0, spin = 0.0, rings = 0.0, shadows = 1, cloud_shadow = 1.0, shadow_height = 0.5 }

[[parts]]
id = "clouds"
kind = "clouds"
shader = "clouds"
graph = "clouds"
members = { shader = "shaders::clouds", field = "mixed", slope_x = "slope_x", slope_y = "slope_y", slope_z = "slope_z" }
# gradient = 2：软云档。surface_level = 等值面高度（硬表面那条路的同一个阈值）。
# shadow = 自阴影强度（软档里 1 = 全量、0 = 关）。extinction = 不透明度。
params = { gradient = 2, surface_level = 0.20, inner = 1.01, outer = 1.06, extinction = 1400.0, coverage = 0.35, base = 0.06, top = 0.62, detail_scale = 16.0, detail_strength = 0.55, erode = 0.0, phase = 0.62, shadow = 1.0, steps = 56, bump = 0.85, seed = 7, slope_scale = 0.12, taper = 0.45, coverage_gain = 2.6 }

[[parts]]
id = "atmosphere"
kind = "atmosphere"
shader = "atmosphere"
graph = "shaders"
members = { shader = "atmosphere" }
params = { inner = 1.0, outer = 1.14, density = 0.3, softness = 0.5, tint = [0.44, 0.64, 0.98] }
