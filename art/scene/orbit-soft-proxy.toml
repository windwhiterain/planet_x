# 场景配方：软云档 ＋ 粗代理几何。
#
# 与 orbit-soft 只差 clouds part 多一个 `proxy` 成员 —— 几何从 `ico(64)` 球壳换成
# `clouds` 图烘出来的粗代理 mesh（`shape_of(cover, altitude, 1.0)` 的等值面，τ = 0.20）。
# 粗代理包住真场（`billows ∈ [0,1]` ⇒ `final ≤ coarse`）⇒ 有云的像素一个都不该丢，
# 空区域在光栅阶段就被剔除。`art/clouds/coarse.toml` 的形状参数与下面 clouds part 逐项相同。
#
# 烘：cargo run -p px_graphs --bin scene orbit-soft-proxy

name = "orbit-soft-proxy"
ambient = 80.0
cameras = "review"

[[parts]]
id = "planet"
kind = "planet"
shader = "surface"
graph = "planet"
members = { height = "height", mesh = "surface", shader = "shaders::surface" }
params = { palette = "rocky", displace = 0.06, sea_level = 0.52, radius = 1.0, spin = 0.0, rings = 0.0, shadows = 1, cloud_shadow = 1.0, shadow_height = 0.5 }

[[parts]]
id = "clouds"
kind = "clouds"
shader = "clouds"
graph = "clouds"
members = { shader = "shaders::clouds", field = "mixed", slope_x = "slope_x", slope_y = "slope_y", slope_z = "slope_z", proxy = "clouds::proxy" }
params = { gradient = 2, surface_level = 0.20, inner = 1.01, outer = 1.06, extinction = 1400.0, coverage = 0.35, base = 0.06, top = 0.62, detail_scale = 16.0, detail_strength = 0.55, erode = 0.0, phase = 0.62, shadow = 1.0, steps = 56, bump = 0.85, seed = 7, slope_scale = 0.12, taper = 0.45, coverage_gain = 2.6 }

[[parts]]
id = "atmosphere"
kind = "atmosphere"
shader = "atmosphere"
graph = "shaders"
members = { shader = "atmosphere" }
params = { inner = 1.0, outer = 1.14, density = 0.3, softness = 0.5, tint = [0.44, 0.64, 0.98] }
