# 真场代理当内容：与 orbit-proxy.toml **只差** clouds part 的 `proxy` 成员指向 `clouds::proxy_fine`
# （那份烘的是含细节的真场，见 art/clouds/coarse_fine.toml）。
#
# 目的：代理的 fragment 落点贴近真表面 ⇒ 步进起点从 ~47 步掉到个位数。
# ⚠ 步进栅格仍锚在**壳**的入射点上（绝对），代理只决定起始下标 ⇒ 外观必须与 orbit-surface 逐字节相同。
# 判据是像素（不是包住）：不同就是覆盖不足（轮廓）或停在局部区间起点（零散）。
#
# 烘：cargo run -p px_graphs --bin clouds  然后  cargo run -p px_graphs --bin scene orbit-proxy-fine

name = "orbit-proxy-fine"
ambient = 80.0
cameras = "review"

[[parts]]
id = "planet"
kind = "planet"
shader = "surface"
graph = "planet"
members = { height = "height", mesh = "surface", shader = "shaders::surface" }
params = { palette = "rocky", displace = 0.06, sea_level = 0.52, radius = 1.0, spin = 0.0, rings = 0.0 }

[[parts]]
id = "clouds"
kind = "clouds"
shader = "clouds"
graph = "clouds"
members = { shader = "shaders::clouds", field = "mixed", slope_x = "slope_x", slope_y = "slope_y", slope_z = "slope_z", proxy = "clouds::proxy_fine" }
params = { ablate = "surface", inner = 1.01, outer = 1.06, extinction = 900.0, coverage = 0.35, base = 0.06, top = 0.62, detail_scale = 16.0, detail_strength = 0.55, erode = 0.0, phase = 0.62, shadow = 1.0, steps = 56, bump = 0.85, seed = 7, slope_scale = 0.12, taper = 0.45, coverage_gain = 2.6 }

[[parts]]
id = "atmosphere"
kind = "atmosphere"
shader = "atmosphere"
graph = "shaders"
members = { shader = "atmosphere" }
params = { inner = 1.0, outer = 1.14, density = 0.3, softness = 0.5, tint = [0.44, 0.64, 0.98] }
