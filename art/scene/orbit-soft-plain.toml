# 消融档：与 orbit-soft 只差 planet part 的两个旋钮都关掉（`shadows = 0` ＋ `cloud_shadow = 0`）。
#
# 判据：这一档**只剩换材质本身**（自写 surface material vs 原来的 `StandardMaterial`）——
# 拿它和换材质之前那张 `regr-shot-r1-orbit-soft.png` 并排，量出来的就是 §39.6 阶段 3
# 说的"差异带"：山自阴影与云影都不在，差异只可能来自光照模型那一份（我们主动丢掉了
# 直接光的高光那一项，漫反射那几项逐字对齐 `bevy_pbr`）。
#
# 烘：cargo run -p px_graphs --bin scene orbit-soft-plain

name = "orbit-soft-plain"
ambient = 80.0
cameras = "review"

[[parts]]
id = "planet"
kind = "planet"
shader = "surface"
graph = "planet"
members = { height = "height", mesh = "surface", shader = "shaders::surface" }
params = { palette = "rocky", displace = 0.06, sea_level = 0.52, radius = 1.0, spin = 0.0, rings = 0.0, shadows = 0, cloud_shadow = 0.0, shadow_height = 0.5 }

[[parts]]
id = "clouds"
kind = "clouds"
shader = "clouds"
graph = "clouds"
members = { shader = "shaders::clouds", field = "mixed", slope_x = "slope_x", slope_y = "slope_y", slope_z = "slope_z" }
params = { gradient = 2, surface_level = 0.20, inner = 1.01, outer = 1.06, extinction = 1400.0, coverage = 0.35, base = 0.06, top = 0.62, detail_scale = 16.0, detail_strength = 0.55, erode = 0.0, phase = 0.62, shadow = 1.0, steps = 56, bump = 0.85, seed = 7, slope_scale = 0.12, taper = 0.45, coverage_gain = 2.6 }

[[parts]]
id = "atmosphere"
kind = "atmosphere"
shader = "atmosphere"
graph = "shaders"
members = { shader = "atmosphere" }
params = { inner = 1.0, outer = 1.14, density = 0.3, softness = 0.5, tint = [0.44, 0.64, 0.98] }
