# 场景配方：**天王星档**（V7）—— 同一张 `gasgiant` 图 + 另一套材质参数，对齐 `art/reference/gasgiant-uranus.png`。
#
# ⚠ 这一档的意义有两层：
#   ① 参考图（`gasgiant-uranus.png`）上那颗天体是**几乎无特征的淡青蓝**：整颗球一片均匀的
#      青蓝、边缘略暗（不是发亮的边缘）、中右一条**很淡的亮纹**；
#   ② 它同时是**这三档色相分层是否通用**的判据：土星档靠"暖带 / 奶油区 / 冷极"分层，
#      天王星档把同样三档收到几乎中性 —— 同一份 shader、同一张图，只换参数。
#
# 与土星档（`orbit-gasgiant.toml`）的差别：
#   · **没有环、没有卫星**（参考图上这两样都没有；`rings` 不给 ⇒ 环那一段不烘）；
#   · `absorption` 反过来：**红光吸得最多**（`[1.55, 0.62, 0.22]` ⇒ 透过率红最小、蓝最大）
#     —— 这正是甲烷大气那层青蓝的来源，而土星档是"蓝吸得多 ⇒ 偏暖"；
#   · `band_gain` / `band_contrast` / `detail_strength` 都压到很低 ⇒ 只剩那条淡亮纹；
#   · `limb` 压到 0.05：参考图的边缘是**暗**的（掠射路径长 ⇒ 吸收多），不是亮的；
#   · `shadows` 关掉：这一档没有投影物（省掉整趟阴影）。
#
# 烘：px run gasgiant        （条带场已经有了，--build 只在改过图/实例时要）
#     px run scene orbit-uranus
# 渲：px_render --offline --scene <产物> --out x.png --width 960 --height 640

name = "orbit-uranus"
ambient = 80.0
cameras = "review"

[[parts]]
id = "planet"
kind = "planet"
shader = "gasgiant"
graph = "planet"
members = { shader = "shaders::gasgiant", bands = "gasgiant::mixed", detail = "gasgiant::filaments" }
primitive = "icosphere"
params = { palette = "gas", displace = 0.010, sea_level = 0.45, radius = 1.0, subdivisions = 64, spin = 0.0, albedo = [0.780, 0.860, 0.930, 1.0], absorption = [1.55, 0.62, 0.22, 1.0], wrap = 0.55, thickness = 1.15, limb = 0.05, band_gain = 0.06, band_contrast = 0.25, sun_gain = 1.00, ambient = 0.85, hemi_depth = 0.15, haze = 0.18, shadows = 0.0, detail_scale = 6.0, detail_strength = 0.10, filament_gain = 0.12, belt_tint = [1.005, 0.995, 1.000, 1.0], zone_tint = [0.995, 1.000, 1.008, 1.0], polar_tint = [0.962, 0.985, 1.045, 1.0] }
