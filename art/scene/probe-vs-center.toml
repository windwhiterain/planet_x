# 受控档（§本轮）：**灯正好在 +X 轴上**、没有环 ⇒ 行星必然落在面 0（+X）的正中央。
# 用途：把"那一面"这件事的不确定性消掉 —— 影图里若只有一层有内容，那就应该是第 0 层，
# 而它的内容应该落在**中央那几页**上。任何别的情况都指着一处具体的错。
name = "probe-vs-center"
ambient = 80.0
cameras = "review"

[[parts]]
id = "planet"
kind = "planet"
shader = "surface"
graph = "planet"
members = { height = "height", mesh = "surface", shader = "shaders::surface" }
params = { palette = "rocky", displace = 0.06, sea_level = 0.52, radius = 1.0, spin = 0.0, rings = 0.0, shadows = 1, shadow_density = 256, light_position = [5.0, 0.0, 0.0], light_intensity = 1.9e7 }

[[parts]]
id = "atmosphere"
kind = "atmosphere"
shader = "atmosphere"
graph = "shaders"
members = { shader = "atmosphere" }
params = { inner = 1.0, outer = 1.14, density = 0.3, softness = 0.5, tint = [0.44, 0.64, 0.98] }