# 环：**唯一**一条带 `rings > 0` 的场景 —— 迁移前渲染器里的 `spawn_rings` 走 Bevy 内建
# `StandardMaterial { unlit, blend, cull: none }`（这批场景 `rings = 0`，那条路从来没出过图）；
# 通用渲染之后环是一份自写材质（`art/shaders/ring.wgsl`）＋ 烘图侧生成的环网格与环带贴图。
#
# 它存在的理由：给"环"这条**没实测过**的路径一个判据图。烘/出：
#   cargo run -p px_graphs --bin scene orbit-rings
#   px_render --view  &&  px_render --show --scene <产物>      # 窗口里看
#   px_render --scene <产物> --cam 0,22,4.2 --out target/rings.png

name = "orbit-rings"
ambient = 80.0
cameras = "review"

[[parts]]
id = "planet"
kind = "planet"
shader = "surface"
graph = "planet"
members = { height = "height", mesh = "surface", shader = "shaders::surface" }
params = { palette = "rocky", displace = 0.06, sea_level = 0.52, radius = 1.0, spin = 0.0, rings = 1.6 }

[[parts]]
id = "atmosphere"
kind = "atmosphere"
shader = "atmosphere"
graph = "shaders"
members = { shader = "atmosphere" }
params = { inner = 1.0, outer = 1.14, density = 0.3, softness = 0.5, tint = [0.44, 0.64, 0.98] }
