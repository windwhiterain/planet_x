# **半分辨率中间目标**：反相先落到一张 `rgba16float` / 半尺寸的图上，
# 再由第二条把它读回来写进画面。
#
# ⚠ 这一份与别的配方有一处**形状上的不同**，而且是用户裁决的：**它声明自己的资源**。
# 帧图是**帧**的权威（主链、深度、最终 `view`），而一个后处理的**私有暂存不是帧的资源** ——
# 把它写进帧图等于让"某一档内容需要一张临时图"变成"所有场景都得有这张图"。
# 边界因此是"**帧自己的**资源由帧图配"，不是"内容不许有资源"。
#
# ⇒ 接线规则（`--bin passes` 打的接线，两条一起看才完整）：
#
#     链的头 = 帧图绘制段的输出（`scene_color_a`）
#     [5] invert-to-scratch   读 scene_color_a 写 scratch       ← 读到的是**帧的名**
#     [6] vignette-back-to-view 读 scratch 写 scene_color_b      ← 最后一笔**一定落回帧链**
#     [7] blit                读 scene_color_b                   ← 链尾
#
# 两条规则：① 一笔的读名是**配方自己声明的资源** ⇒ 它是上一笔的落点；
# ② 一笔的读名不是 ⇒ 它是链的头，而**最后一笔一定写回帧链**（否则画面白改）。
# 配方里 `reads = ["view"] / writes = ["scratch"]` 那两行记的是**接线意图**
# （"第一笔从画面读、落进 scratch"），落到文档里的是帧的真名 ——
# 配方不认识 `view` 以外的任何宿主名，这正是它能被搬到别的帧图里的原因。
#
# ⚠ `size = "half"` 是真正的判据之一：它与全尺寸的中间目标**不是同一张图**，
# 而这一档的哈希（`2D61519C6544E3C1`）正落在"半尺寸 + rgba16float 的那一次量化"上。
[[resources]]
name = "scratch"
format = "rgba16float"
size = "half"
usage = ["render_attachment", "texture_binding"]

[[passes]]
kind = "fullscreen"
label = "invert-to-scratch"
shader = "px_grade"
reads = ["view"]
writes = ["scratch"]
params = { strength = 1.0 }

[[passes]]
kind = "fullscreen"
label = "vignette-back-to-view"
shader = "px_vignette"
reads = ["scratch"]
writes = ["view"]
params = { strength = 1.0 }
