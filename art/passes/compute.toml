# 声明了执行器**不兑现**的东西：`kind = "compute"`。
#
# 判据是当场拒，且拒词要说清**理由**。⚠ 这一份的拒词有两档，取决于有没有附件：
#   · 挂了颜色附件 ⇒ `compute 不画附件，颜色/深度都不该挂给它`（data model 那一档）；
#   · 没挂附件     ⇒ `这一版执行器只有 fullscreen 与 geometry`（**能力**那一档）。
# 两档都拒，而先说哪一档是定过的：**先判能力、再判入口名**，
# 否则它会被"片元入口 cs_main 不存在"抢先 —— 而 `cs_main` 本来就**不是**片元入口，
# 真正的理由是"这一版没有 compute"。
[[passes]]
kind = "compute"
label = "reduce"
shader = "px_grade"
entry = "cs_main"
reads = ["view"]
writes = ["view"]
params = { strength = 1.0 }
