# `sky.stars`：**世界坐标里的一批点光源**（R3 星场，统一稀疏格索引）。
#
# ⚠⚠ 这一档在 2026-09-25 换了存储模型（用户口径：*一切物质都应该在世界坐标生成，
#   球体坐标只应当用于储存/采样*）。旧版把星"画"进一张立方图（`field.stars` 出 CubeMap 场），
#   于是三件事同时发生：一个面上纹素角差 3 倍 ⇒ 世界空间里的**圆**被存成**椭圆**
#   （实测面心 σ 径向/切向 1.02、面角 1.57）；星的**位置**按方向格点取整
#   ⇒ 每球面度的密度按 `|dₓ|+|d_y|+|d_z|` 偏（实测面心 11.2e3、面角 15.9e3 星/球面度，
#   1.43x —— 用户的原话是"星星在 cubemap 棱附近好像被压缩了"）；星图与天空面还必须
#   **分辨率配对**（实测不配对时面角/面心的亮面积比 1.58x）。
#   ⇒ 现在星只是**世界坐标里的点**：位置按**体积**均匀撒在壳里，索引交给 R3 稀疏格。

# 星数（撒在下面那层壳的**体积**里）。
count = 4000000
seed = 60613

# 星所在的那层壳（世界单位）。⚠ 与 `art/nebula/density_volume.toml` 的 `inner`/`outer`
# **刻意一致**：星是混在气里的点光源（近处的不被整层气遮住、远处的被前面的气吃掉）。
inner = 1.0
outer = 3.0

# **存储分辨率**：稀疏格的细格边长（世界单位）。
# ⚠ 它与"光照半径"（`art/nebula/emission.toml` 的 `starlight_radius`）是**两个旋钮**：
#   这个决定"一个细格装几颗星"，那个决定"星光能照多远的气"。两者绑死就只能二选一。
#   0.05 时壳内平均每个细格约 0.5 颗星（18 万颗撒在体积 ~100 的壳里）。
cell = 0.05

# 亮度：暗的多、亮的少（取 `(1/draw)^power`，不是 `draw^power`）。
brightness_power = 1.1
# 幂律的尾巴很长（`draw → 0` 时能到几千），钳住免得一颗星打爆整幅图。
max_brightness = 64.0
min_apparent = 2.0

# 成团：变化由星给、背景由气给（用户 2026-09-25）。
clump_count = 64
clump_radius = 0.25
clump_share = 0.0

# 嵌在气里的那一簇亮星（参考图里那几颗明显的星）。
# ⚠ 它们与"场的星"是**同一种东西**（同一张表、同一个格）⇒ 既直射进画面、
#   也照亮周围的气。旧的 `cloud.emission::cluster_*`（只知道方向的 4 颗假光源）由此退役。
cluster_count = 4
# 簇心是**世界坐标的点**（旧版是方向）—— 取旧方向的同一方位、落在半径 2.0 处。
cluster = [0.50, 0.70, 1.80]
cluster_radius = 0.35
cluster_gain = 6.0
cluster_tint = [0.12, 0.30, 1.0]

# ── 大尺度：星跟着**气那一族噪声**走（用户 2026-09-25）────────────────────────
# 下面这几个数**抄自 `art/nebula/envelope.toml`**（频率/种子/octaves/gain/zonal）：
# 同一族 fbm ⇒ 星与气的大尺度图案是同一个（星云在哪、星就在哪）。
# ⚠ 抄的是**数值**，不是把那条 remap 链（阈值/mix）也搬过来 —— 那是气自己的造型，
#   星只要跟它"近似"（用户的原话）。
# ⚠ 做法是**拒绝采样**（接受概率 = 噪声^sky_contrast）⇒ `count` 要按存活率抬上去。
sky_biased = true
sky_frequency = 0.35
sky_octaves = 3
sky_lacunarity = 2.0
sky_gain = 0.5
sky_seed = 9173
sky_zonal = 0.9
sky_contrast = 2.0

# ── 精确相关：星按**真实密度场**拒绝采样（体积图的 `stars` 吃 `cloud.density`）────
# ⚠ 用户 2026-09-25："让星星和星云在大尺度上分布近似"。
#   实测只抄 envelope 那一层噪声时相关只有 +0.022（气的分布是整条链的阈值/mix 定的）
#   ⇒ 必须吃**真密度场**。接受概率 = (密度/平均密度)^gas_contrast，上限 1。
# ⚠ 拒绝采样只能变稀 ⇒ `count` 要按存活率抬上去。
gas_biased = true
gas_contrast = 1.5

# 分色诊断：星光走蓝（散射走红在 art/nebula/emission.toml 的 glow_tint）。
star_tint = [0.12, 0.30, 1.0]
gas_floor = 0.35

# 星压向壳外侧（相机与它之间的气柱最长 ⇒ 才遮得住）。
gas_depth = 1.5
