# `field.stars`：球面上的**稀疏星点**（出的是场，参与积分）。
#
# ⚠ 这颗星点场与体积是**两种画布**：星点是球面的（`CubeMap`）、体积是体网格的。
#   星点不参与体积，只在积分末尾乘一次透射率（于是被气遮住、被尘埃染红）。

# 一格多大（单位：纹素宽）。⚠ 与 `fill` **一起**决定星空的密度：
#   一格一纹素时每格都可能有星 ⇒ 加上光晕就成了"一层纱"。
cells_per_texel = 0.125
fill = 0.005
# 亮度的幂律指数：暗的多、亮的少（取 `(1/draw)^power`，不是 `draw^power`）。
brightness_power = 1.6
seed = 60613
# 核与光晕的半径（**纹素的角宽**倍数，不是绝对弧度 —— 绝对弧度在低分辨率下会糊住整面）。
size = 0.8
halo = 2.2
halo_gain = 0.10
# 嵌在气里的那一簇亮星（参考图里星点不是均匀撒的）。
cluster_gain = 2.4
cluster = [0.25, 0.35, 0.90]
cluster_radius = 0.35
