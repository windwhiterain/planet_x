# `field.stars`：球面上的**稀疏星点**（出的是场，参与积分）。
#
# ⚠ 这颗星点场与体积是**两种画布**：星点是球面的（`CubeMap`）、体积是体网格的。
#   星点不参与体积，只在积分末尾乘一次透射率（于是被气遮住、被尘埃染红）。

# 一格多大（单位：纹素宽）。⚠ 与 `fill` **一起**决定星空的密度：
#   一格一纹素时每格都可能有星 ⇒ 加上光晕就成了"一层纱"。
cells_per_texel = 0.125
fill = 0.032
# 亮度的幂律指数：暗的多、亮的少（取 `(1/draw)^power`，不是 `draw^power`）。
brightness_power = 1.1
seed = 60613
# 核与光晕的半径（**纹素的角宽**倍数，不是绝对弧度 —— 绝对弧度在低分辨率下会糊住整面）。
#
# ⚠⚠ "方块星"的真凶**不是**精灵形状（`field.stars` 用的是径向高斯 `exp(-r²)`，
#   量出来的邻域是圆的）—— 是**削顶的平台**：高斯太紧（σ≈0.65 纹素）+ 光晕只占 5%
#   ⇒ 白台周围几乎没有渐变（7×7 邻域里 234→255→平台），眼睛读成"方块"。
#   参考图的星是**白核 + 明显粉晕** ⇒ 光晕要宽（3.2 纹素）而矮（峰值 3.5%）：
#   核照样过曝（真实的亮星就是白的），但平台外面有一圈可见的圆晕 ⇒ 读成圆星。
#
# ⚠ 能量耦合（实测撞出来的）：精灵**峰值定死、面积随 size² 涨** ⇒ 换 `size`
#   必须按 1/size² 同步换 `sky.star_gain`，否则整图被星淹没、顶端削顶。
size = 0.65
halo = 3.2
halo_gain = 0.035
# 嵌在气里的那一簇亮星（参考图里星点不是均匀撒的）。
cluster_gain = 3.2
cluster = [0.25, 0.35, 0.90]
cluster_radius = 0.55
