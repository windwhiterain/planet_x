# `sky.nebula`：沿视线积分 —— **一个节点交出一整张天空立方贴图**（HDR）。
#
# `face` 必须与图脚本的 `--face` 一致：它是**输出**贴图的分辨率，也是画布宽度
# （对不上会在形状检查那里当场报）。
face = 256

# 每条射线的步数（含抖动）。给少了会出层状条纹。
steps = 96
# 抖动：按格、按步给采样点一个**确定性**的偏移，把层状条纹打散成噪声。
# ⚠ 它必须同时随格与随步变化（只随步变会让整行拿到同一个偏移 ⇒ 横向条纹）。
jitter = 1.0

# 星点的亮度倍率（星点**乘**透射率 ⇒ 被前面的气遮住、被尘埃染红）。
star_gain = 1.0
# 星图的哪一档算数（亮纹素比例很小，门限决定"有几颗星"）。
star_floor = 0.4
# 背景天空的底色（深黑太空）。
background = [0.0, 0.0, 0.0]
