# `sky.nebula`：沿视线积分 —— **一个节点交出一整张天空立方贴图**（HDR）。
#
# `face` 必须与图脚本的 `--face` 一致：它是**输出**贴图的分辨率，也是画布宽度
# （对不上会在形状检查那里当场报）。
face = 1024

# 每条射线的步数（含抖动）。给少了会出层状条纹。
steps = 96
# 抖动：按格、按步给采样点一个**确定性**的偏移，把层状条纹打散成噪声。
# ⚠ 它必须同时随格与随步变化（只随步变会让整行拿到同一个偏移 ⇒ 横向条纹）。
jitter = 1.0

# 星点的亮度倍率（星点**乘**透射率 ⇒ 被前面的气遮住、被尘埃染红）。
star_gain = 0.10

# 星点的轮廓：**弧度**（不是"几个纹素"）。
#
# ⚠⚠ 核宽按纹素给是旧版的病根：那等于让**存储网格的斜度**决定世界空间里一个点的大小
#   （立方图一个面上纹素角差 3 倍 ⇒ 同一个圆在面心与面角是两种形状）。给弧度之后，
#   形状与方向无关，采样多细是**输出面**自己的事。
#
# 取法：面 1024 的面心纹素角是 `2/1024 = 1.95e-3`，核给 1.5 纹素 ≈ 2.9e-3 rad
# ⇒ 面角处（纹素角小 3 倍）也有 4 个纹素宽 ⇒ 任何位置都不会漏采样。
star_core = 0.006
# 外晕：参考图的星是"白核 + 明显粉晕"，晕要**宽而矮**（峰值 3.5%）。
# ⚠ 这一档只是"星自己的光学弥散"；**被星照亮的气**那一圈晕住在
#   `cloud.emission` 的 `starlight_*` 里（它是气发出的光，天然有形状）。
star_halo = 0.012
star_halo_gain = 0.035

# 背景天空的底色（深黑太空）。
background = [0.0, 0.0, 0.0]
