#
# ⚠⚠ 这一档是为**局域对比的 p90** 加的，而它是被量出来的：
#   加包络那一步（上一轮）把**中位**局域对比拉到了 0.00176（参考 0.00200，只差 14%），
#   但 **p90 还差 2.4 倍**（0.00522 对 0.01263）。
#   ⇒ "细节的**典型量**"够了，缺的是**少数地方有强反差** —— 也就是**细丝**。
