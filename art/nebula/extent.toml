# `field.remap`：**包络** —— 一大块"有气"的区域，其余方向**真空**。
#
# ⚠⚠ 这一档是打破**球对称**的那一刀，而它是量出来的：
#   `cloud.emission` 的壳均匀包住观察者 ⇒ 每条视线都穿过等量的气 ⇒ **黑色不存在**。
#   实测（`--face 256`）：我的 p10=0.0110 / p90=0.0341（p90/p50=1.7），
#   而参考图是 p10=0.0051 / p90=0.0972（p90/p50=**5.7**）——
#   总能量相当（亮于 0.02 的都约 45%），差的是**动态范围**。
#
# 窗口给得**很窄**：窄窗口把低频的团块场二值化成"有 / 没有"，
# 于是天空的一半真空、另一半聚着气。给宽了就退回"到处都有一点"。
in_min = 0.40
in_max = 0.68
out_min = 0.0
out_max = 1.0
smooth = true

# ⚠⚠ **`gamma` 是"平均值"那一个旋钮**，而第一版正是漏了它：
#   二值化之后气占了天空的一大半 ⇒ 整幅被抬起来（实测 p50 = **0.0495**，参考图 0.0171），
#   于是"局域对比很好了、画面上却是一片发白的云"。
#   由 `p50 ∝ m^gamma`（`m` = 包络均值）反解：要落到 1/3 左右，`gamma ≈ 3`。
#   ⚠ 它**压的是中间、不压峰**（`0.5³=0.125` 掉 8 倍，`0.9³=0.729` 只掉 1.4 倍）
#   —— 正是"暗部压到黑、亮部留住"该有的形状。
gamma = 2.0
