# `cloud.emission`：逐体素的**发射与消光**（体渲染的"材质"）。
#
# ⚠ 光照在这里按体素算完，不留步进：阴影只与"这一点"有关、与看它的视线无关。
#   这是"烘图时步进"能成立的全部理由。

# 光源方向（世界空间，会被归一化）：星云内部那颗电离源的方位。
# 参考图里最亮的核心在画面中上部偏右 ⇒ 先朝 +Y +Z 那一片。
light = [0.25, 0.35, 0.90]
# 光源在壳内的半径比例（0 = 球心、1 = 外壁）。
# ⚠ 从这个数决定"照亮多大一片"：0.30 时亮的是一大块气（画面上半个球都在发光），
#   而参考图的结构特征是"**一个亮核 + 大片暗**" ⇒ 收到 0.12 让亮区聚成一个核。
light_radius = 0.28
# 朝光源步进多少步算遮挡：步数越多边缘越锐（代价线性）。
shadow_steps = 24
# 遮挡的浓度：`exp(-τ × 这个)`。给大了只剩最靠近光源的一薄层亮。
shadow_gain = 2.0

# 发射 = `density^power × gain`：power > 1 ⇒ 只有浓的地方才亮（薄雾几乎不发光）。
#
# ⚠ **`power` 是"整幅有多黑"的主旋钮，而它是被量出来的**：
#   参考图的**线性均值 / 最亮 1% 之比只有 0.124**（0.056 / 0.450），
#   而 `power = 4` 那一版是 **0.5**（0.327 / 1.0）—— 那是"整幅都亮着"，
#   画面上是米色雾而不是深黑太空。
#   要这个比值就得让"中等密度几乎不发光"：由 `mean/peak = (d_mean/d_peak)^power`
#   反解得 `power ≈ 5~6`（玫瑰星云那一类照片本来也是这个形状）。
#
# ⚠ 而 `gain` 只负责**整体亮度**（不动比值）：亮度对齐靠它、形状对齐靠 `power`
#   —— 两者分开是有意的，不然"调暗一点"会把反差也一起改掉。
#
# ⚠⚠ **`gain` 是被量出来的一格，不是猜的**（这一轮实测，`--face 256`）：
#
# | gain | 线性均值 R:G:B | 亮于 0.05 的面积 | 局域 std 中位 / p90 |
# |---|---|---|---|
# | 1.2 | 0.029:0.019:0.027 | 1.6% | 0.00045 / 0.00116 |
# | **2.3** | **0.051:0.034:0.048** | 13.4% | **0.00084 / 0.00215** |
# | 3.5 | 0.076:0.051:0.070 | 54.6% | 0.00125 / 0.00324 |
# | 参考 | 0.056:0.032:0.051 | 23.3% | 0.00200 / 0.01263 |
#
# 2.3 的**均值与色相几乎正中参考图**（R/B 1.06 对 1.10），而局域对比也是三档里最好的。
# ⇒ 亮度这一维**已经调到位了**，剩下的差距是**结构**（局域对比仍差 2.4~6 倍）。
# ⚠⚠ **底光的两栏各管一件事，而它们必须配套**：
#
# | `glow_power` | 亮 15% 的 G/R（参考 0.81） | 暗 50% 的 G/R（参考 0.24） |
# |---|---|---|
# | 1.0 | 0.79 ✅ | **1.58** ❌ 底光到处都在，暗部整个变蓝 |
# | 3.5 | 待测 | 待测 |
#
# ⇒ 幂**低**时底光在薄处也很强（`d¹` 不小），把暗部染蓝；
#   幂**高**才只剩浓处那一段 ⇒ 核保住蓝白、暗部交回"主发射 + 消光"（玫红）。
emission_power = 4.5
emission_gain = 1.9
glow_gain = 0.850
glow_power = 1.6
glow_threshold = 0.48
glow_tint = [0.35, 0.85, 1.15]

# 消光：**逐通道**（R, G, B）。
#
# ⚠ 量级要**小**：σ 的中位数是"密度 × 系数"，密度中位 0.5 ⇒ 系数 1.4 就得到 σ≈0.7，
#   而壳的路径长 1~2 ⇒ 光学深度 τ ≈ 1~2 ⇒ **只见表面**（深处发出来的光全被吃掉），
#   画面上是一片没有结构的糊。给 0.3~0.9（τ ≈ 0.3~0.8）才**半透明**、看得见丝。
#
# ⚠⚠ **哪个通道大是"色相"的关键，而这件事我猜错过一次**：
#   上一版取 `[0.18, 0.62, 1.70]`（蓝吃得最多），出来的画面是**橙褐色**
#   —— 最亮 10% 的 R/B = **2.23**。而参考图最亮 10% 是 R:G:B ≈ 0.19:0.16:0.20，
#   **蓝略高于红**（R/B = 0.94），中位那一半是 0.040:0.014:0.029（R/B = 1.36）。
#   那是"蓝白亮核 + 玫红包边"的玫瑰星云，**不是**橙色。
#   ⇒ 消光不能朝"蓝吃得最多"那个方向给：**绿吃得最多**（剩下的偏洋红/紫），
#   红略多于蓝的消光（于是红略多于蓝）。
extinction = [0.0, 3.6, 0.40]
extinction_power = 1.0
# 尘埃那一笔：密度超过阈值之后额外加的消光（参考图里那些黑柱比周围的雾浓得多）。
dust_bias = 0.6
dust_threshold = 0.45
