# `cloud.emission`：逐体素的**发射与消光**（体渲染的"材质"）。
#
# ⚠ 光照在这里按体素算完，不留步进：阴影只与"这一点"有关、与看它的视线无关。
#   这是"烘图时步进"能成立的全部理由。

# 光源方向（世界空间，会被归一化）：星云内部那颗电离源的方位。
# 参考图里最亮的核心在画面中上部偏右 ⇒ 先朝 +Y +Z 那一片。
light = [0.25, 0.35, 0.90]
# 光源在壳内的半径比例（0 = 球心、1 = 外壁）：放在偏内的位置，亮核才"嵌"在气里。
light_radius = 0.30
# 朝光源步进多少步算遮挡：步数越多边缘越锐（代价线性）。
shadow_steps = 24
# 遮挡的浓度：`exp(-τ × 这个)`。给大了只剩最靠近光源的一薄层亮。
shadow_gain = 2.2

# 发射 = `density^power × gain`：power > 1 ⇒ 只有浓的地方才亮（薄雾几乎不发光）。
# ⚠ power 高 + gain 低 = "只有浓的地方才亮"（暗部压下去，画面上才有大片黑）。
# ⚠ power 高 + gain 低 = "只有浓的地方才亮"（暗部压下去，画面上才有大片黑）。
#   实测 power 2.2 时整张图是"奶白色的雾"（中位 0.056、峰值 0.77 ⇒ 反差只有一档多一点）。
emission_power = 4.0
emission_gain = 6.0

# 消光：**逐通道**（R, G, B）。蓝吃得比红多 ⇒ 透过尘埃的光**变红**（星云照片里那条红化）。
# 三个数给成一样的话，尘埃只会把东西变暗、不会变色。
#
# ⚠ 量级要**小**：σ 的实测中位数是"密度 × 系数"，密度中位 0.5 ⇒ 系数 1.4 就得到 σ≈0.7，
#   而壳的路径长 1~2 ⇒ 光学深度 τ ≈ 1~2 ⇒ **只见表面**，画面上是一片没有结构的糊。
#   但要**半透明**才看得见丝 ⇒ 现在给到 0.2~1.2（τ ≈ 0.3~0.8）。
#
# ⚠ **通道之间的差**要拉大：实测三档 0.30/0.46/0.72 出来的画面几乎是灰的
#   （六面的 R:G:B 均值 = 1 : 0.90 : 0.73，只差四分之一）。要想"明显偏红"，
#   蓝的系数得是红的 3 倍以上 —— 因为颜色来自 `exp(-σ_B·ds)` 与 `exp(-σ_R·ds)` 的**比值**，
#   而两者都要走完整段壳，差了 0.2 的系数在 τ≈0.5 时只差 10%。
extinction = [0.18, 0.62, 1.70]
extinction_power = 1.0
# 尘埃那一笔：密度超过阈值之后额外加的消光（参考图里那些黑柱比周围的雾浓得多）。
dust_bias = 0.6
dust_threshold = 0.45
