# `field.fbm3`：星云的**大团块**（体素坐标里的三维分形噪声）。
#
# ⚠ 频率的参照系是"**一整面 = 1.0**"（体素坐标是 `[0,1]³`）⇒ `frequency = 1.4` 就是
#   一面之内约 1.6 个大团块。
#
# ⚠ `gain` 要低（0.45 上下）：fbm 的 gain 决定高频占多少。给 0.5 时各档能量相近 ⇒
#   值挤在中间（一团糊）；给 0.45 以下 ⇒ **大量接近 0 的暗区 + 少数亮点**，
#   那才是"丝状/分形"的分布，也才撑得起"极暗与极亮并存"的对比。
frequency = 1.4
octaves = 4
lacunarity = 2.0
gain = 0.45
seed = 4107
# 径向拉伸：盘状/纤维状结构是沿视线方向拉长的，而各向同性的噪声给的是"一坨坨圆球"。
# > 1 把结构沿径向**压扁**（变化更快），< 1 拉长。先给 0.8（略拉长）。
zonal = 0.8
