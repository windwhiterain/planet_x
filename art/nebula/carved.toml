# `field.remap`：**细丝的门** —— 高频脊线场 → "这里还留得住气"。
#
# ⚠⚠ 窗口是这一档唯一的旋钮，而它直接决定**丝有多细、反差有多强**：
#   脊线场的值大多挤在中段 ⇒ 窗口**窄**（0.62~0.68）时只有脊顶那一条线留下
#   ⇒ 丝细而反差强；窗口宽时整片都在 ⇒ 退回"一层灰"。
#
# 参考：加包络之后局域对比 **中位 0.00176**（参考 0.00200，已差 14%），
#       而 **p90 只有 0.00522**（参考 0.01263，差 2.4 倍）⇒ 缺的正是这一档。
in_min = 0.42
in_max = 0.80
out_min = 0.0
out_max = 1.0
smooth = true
gamma = 0.7
