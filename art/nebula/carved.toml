# `field.remap`：**暗尘带的脊** —— 把 ridged 场的顶部切成"要雕掉的缝"。
#
# ⚠⚠ 用法（图里的 `textured` 节点）：`mix(shaped, 真空, 本场)` = `shaped × (1 − 本场)`。
#
# 与上一轮失败那版的全部区别，就是**乘的是 (1 − 稀疏脊) 而不是 (稠密门)**：
#   失败版 `mix(0, shaped, 门)` = `shaped × 门`，门的均值在 0.5 附近
#   ⇒ **整片密度被砍半**（实测均值 0.055 → 0.021，局域对比反而掉到 0.00075）。
#   这一版只在**脊线的顶部**开缝 ⇒ 平均不动、缝细而反差强。
#
# 窗口给在**顶部**：ridged 场（`wisps`，值域 0..1、均值 ~0.5）只有接近 1 的
# 是细脊线。
# ⚠ 实测（`--shape 64` 的场读数）：窗口 `[0.72, 0.86]` 会把均值从 0.1334 削到
#   0.1218 —— **削掉 8.7%**，太狠（那是"挖渠"不是"刻缝"）。
#   收到 `[0.80, 0.93]` 只碰脊顶 ⇒ 缝细、平均不动。
# `out_max = 0.8` ⇒ 缝里留 20% 的气（雕到 0 会像"破洞"，星点会从缝里透出来）。
in_min = 0.84
in_max = 0.88
out_min = 0.0
out_max = 0.82
smooth = true
gamma = 1.0
