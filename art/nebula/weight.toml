# `field.remap`：**对比度** —— 星云要有"大片空 + 少数浓"，不能是一团均匀的雾。
#
# ⚠ 窗口给**窄**（`in_min` 到 `in_max` 只跨 0.30）是有意的：fbm 的值挤在均值 0.51 附近
#   （实测 `blobs` 值域 0.058..0.908、均值 0.513），窗口宽了整张图都是中灰 ⇒
#   画面上是"一片均匀的褐色雾"，而参考图里**大部分是接近黑的太空**。
#   窄窗口把中位数压到低位、只留少数峰值 —— 那才叫团块。
in_min = 0.32
in_max = 0.62
out_min = 0.0
out_max = 1.0
smooth = true
