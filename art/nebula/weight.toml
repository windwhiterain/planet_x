# `field.remap`：**密度场的形状** —— 星云要的是"大片空 + 少数浓"，不是一片中灰。
#
# ⚠ 窗口给得**很窄**（`in_min` 到 `in_max` 只跨 0.30）：fbm 的值挤在均值 0.51 附近
#   （实测 `blobs` 值域 0.058..0.908、均值 0.513）⇒ 窗口宽了整张图都是中灰，
#   画面上是"一片均匀的雾"，而参考图里**大部分是接近黑的太空**。
in_min = 0.36
in_max = 0.66
out_min = 0.0
out_max = 1.0
smooth = true

# ⚠⚠ **`gamma` 才是"形状"那一步**，而它是这一轮加进来的：
#   收窄窗口只是**线性**拉伸（把中灰搬成中灰的另一个值），出不来"大片接近 0 + 少数尖峰"
#   —— 参考图的线性均值/最亮 1% 只有 0.112，那是个**非线性**形状。
#   实测：`gamma = 1`（只收窄窗口）出的是均匀的洋红雾；`gamma = 3` 才把中灰压下去、
#   让团块与丝从背景里"跳"出来。
#
# ⚠ 这一档作用于**密度**（不是发射）。发射那一侧已经压到 `power = 6`，
#   再压只会把结构连亮部一起压没 —— 非线性该加在**密度**上，让"浓"与"淡"先分开。
gamma = 3.0
