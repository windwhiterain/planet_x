# 低频包络 -> [0,1] 权重（**温和调制**）。
#
# ⚠ 四版实测（`--cam 135,-10,6.0`）：
#   v1 开关式(0.34/0.62/g1.3)：亮 21.1% ✗   v2 定标(0.18/0.52/底0.15)：亮 31.3% ✗
#   **v3 温和(0.05/0.30/0.75~1.0)：亮 45.5% ✓ 构图 0.628 ✓**（参考 45.2% / 0.609）
#   v4 强构图(0.16/0.54/底0.05)+增益补偿：亮 30.4% ✗
# ⚠ v4 的教训：**tone 的自动锚点会把全局增益归一化掉** ⇒ "先压暗再补光"无效；
#   掩码真正改的是**分布形状**，锚点救不回来 ⇒ 强构图必然牺牲"亮>0.02 ≈45%"这条线。
in_min = 0.05
in_max = 0.30
out_min = 0.75
out_max = 1.0
smooth = true
gamma = 1.0
