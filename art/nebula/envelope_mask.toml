# 低频包络 -> [0,1] 权重。
#
# ⚠ 两版实测：
#   * v1（0.34/0.62/gamma1.3）：密度均值 0.120 -> 0.062，亮>0.02 44.9% -> 21.1% ✗ 太狠；
#   * v2（0.18/0.52/底0.15）：均值回到 0.110，但亮仍只有 31.3% ✗（亮的核被削掉了），
#     而归一化大尺度构图只从 0.701 到 0.524（参考 0.609）—— 收益不抵代价。
# ⇒ v3 **温和调制**：只给 ±25% 的大尺度起伏（不做"有没有气"的开关），
#   亮度交回给密度与发射，构图靠星团与低频起伏共同给。
in_min = 0.05
in_max = 0.30
out_min = 0.75
out_max = 1.0
smooth = true
gamma = 1.0
