# `cloud.density`：三维场 → 可步进的**密度体积**。
#
# ⚠ 这里的两栏**各是一个旋钮**（不是"面内定了一切"）：
#   格数是 `res × res × layers` 级 ⇒ 层数一旦跟着面内分辨率走就是 `res³`。
#   实测把两者绑死时 `--face 128` **烘不完**（10 分钟超时）、`--face 256` **分配 50 GB 失败**。
#   星云要的是"角向细节 + 适中的径向分层"：丝与星点都在角向上。

# 面内格数（**绝对数**，不是比例）：格数是 `res × res × layers` 级。
res = 64
# 径向层数（独立于面内分辨率）。径向的细结构另有 `reach` 保守化兜底。
layers = 64

# 壳的内外半径（世界点 = 方向 × 半径）。星云是"你身处其中"的一层壳：
# 内半径给 1.0（近处留一点空，免得视线一出发就撞上浓气）、外半径 3.0（够长才积得出亮）。
inner = 1.0
outer = 3.0

# 径向保守化（格）：视线沿径向走得长，细结构会被整根跨过 ⇒ 取里外各一格的最大值。
reach = 0
