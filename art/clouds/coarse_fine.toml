# 真场代理的体积网格。与 `coarse.toml` 只差两处：`field = "final"` 与分辨率。
#
# `field = "final"` = shader `cloud_field` 返回的那个量（`coarse` 再乘细节场）。
# 粗场的等值面是**外接**真等值面的 ⇒ 落点离真表面 ~47 步；真场代理的落点贴着真表面。
#
# 分辨率：覆盖度的细节波长只有约 2.7 格 @65² ⇒ 65² 会把峰值削掉一半（实测漏掉 2/212 条
# 方向上的整块云，也是 `reach` 那一层存在的理由）。129² 把它抬到 5.4 格。
# 径向仍 65 层：径向格 0.05/64 = 0.00078，与 shader 的步距 0.05/56 = 0.00089 同量级。
res = 129
layers = 65
inner = 1.01
outer = 1.06
tau = 0.20
scale = 1024.0   # 真场的 |∇| 比粗场大（量出来的值见烘的打印）；稠密 MC 的插值对尺度不变
reach = 1        # ⚠ 不许去掉：节点之间漏掉的峰 = 缺几何 = 硬失败
field = "final"

coverage = 0.35
base = 0.06
top = 0.62
taper = 0.45
coverage_gain = 2.6
erode = 0.0
orientation = [0.0, 0.0, 0.0, 1.0]
