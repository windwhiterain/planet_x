# 代理 mesh：拿 `coarse` 那张体积网格出等值面。
#
# 这个文件是「只改等值面参数」的那一侧：改 `depth` 只该让 mesh 重算，
# 上游的体积网格必须照命中（缓存的意义所在）。
#
# 六个面各自在自己的 [0,1]³ 里跑一次稠密 marching cubes，接缝上的重复顶点按位置焊掉
# （见 px_mesh_op/src/proxy.rs 的注释：自适应哈希八叉树那一版实测焊不严且不可复现）。

level = 0.0   # 体积里存的就是 (粗场 - τ)/L，等值面在 0
depth = 5     # 每面每轴 2^5 + 1 = 33 个采样点；代理要粗
weld = 1e-4   # 焊缝容差（世界单位，约 3e-4 个格子对角线的 1/250）
