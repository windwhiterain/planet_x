[workspace]
members = ["web"]
resolver = "3"

[package]
name = "planet_x"
version = "0.1.0"
edition = "2024"
description = "A turn-based solar-system sandbox trajectory generator for the Planet X game."

[dependencies]
serde = { version = "1", features = ["derive"] }
# Generate a machine-readable JSON Schema for the agent's state view, so the
# agent can *introspect* the schema (`schema` / `meta.schema`) instead of
# memorising it — the "self-describing schema" piece of the architecture.
schemars = { version = "1.2", features = ["derive"] }
ron = "0.8"
clap = { version = "4", features = ["derive"] }
comfy-table = "7"
colored = "2"
# `float_roundtrip`：**解析**浮点必须精确。默认的快速解析器对某些十进制串会落到相邻的
# double 上（实测：文件里写着 `1.4000000000000001`，默认解析读回来是 `1.4`）——于是
# 「读出来的数 ≠ 写出去的数」。这个项目全靠数值说话（投影 → Python → diff → 回读），
# 这种静默漂移必须掐掉。
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }

[profile.release]
opt-level = 3

# **测试档 = `opt-level = 1` + `debug = 1`**（2026-10 再量一轮之后的甜点，见 `test-wall-clock.md` §0.2）。
#
# 这里曾经写着 `opt-level = 2`（`test-wall-clock.md` 的 P0，2025）：那时**长局用例住在 Rust 里**，
# 全档 ~110 s 里绝大部分是**模拟的机器码**——提档后最重的长局 77.2 → 18.1 s（4.27×），值。
#
# **2026-10 之后那条依据没了**：长局/中档用例搬到 `play/tests/`（数据级断言，跑在 **release**
# 二进制 + 投影缓存上，见 `test-decoupled-suite.md`），Rust 侧只剩两百来条**快档**单测。
# 它们真跑只要几秒，而 `opt-level = 2` 让每次「改一个文件」的 test 档重编从个位数秒变成
# 几十秒 ⇒ 先回到 `dev` 默认（O0，用户裁决：*「test 不要 opt」*）。
#
# **上面那套「冷热账」是长局还在 Rust 里时量的**（真跑 O0 16.5 s vs O1 4.7 s ⇒ 当时 O1 赢）。
# 2026-10 第 7 批把长/中档全部搬到 `play/tests/` 之后，Rust 侧只剩 149 条单测（真跑 ~3 s），
# **编译 + 链接成了稳态的大头** ⇒ 平衡翻转，回到 O0（用户裁决：*「test 不要 opt」*）。
#
# 今天背靠背实测（同一台机、同一批用例）：
#
# | 档 | 切档首次（依赖 + 测试目标按新档重编） | `touch src/lib.rs` + 门（稳态） | 其中真跑 |
# | --- | --- | --- | --- |
# | O1（旧） | ~89 s | **17.6 s** | 3.0 s |
# | **O0（现在）** | **44 s** | **11.9 / 12.6 s** | 5.9 / 6.6 s |
#
# ⇒ 编译 + 链接从 14.6 s 掉到 ~6 s：**稳态每轮门快 5 s、切档省 45 s**，代价只是真跑慢 3 s。
# `debug = 1`（只要行号、不生成完整 debuginfo）保留着，顺带让链接更快。今天顺手量了 `debug = 0`：
# 只再省 ~0.2 s（10.1 vs 10.3 s）而丢掉行号 ⇒ **不值**，退回 `debug = 1`。
#
# ⚠ **唯一要记得的**：`tests/probes` 里那 31 条 `#[ignore]` 探针会跑长局，O0 下慢 ~4×
# —— 它们本来就是**调试量具**、不在门里（别拿 `--run-ignored all` 当门）；真要跑就临时切回 O1。
#
# 想在 Rust 侧跑长局不是理由：长局有 `play/tests/run.py 3`（release 二进制 + 缓存），
# 那才是该付优化编译钱的地方。
#
# **行为中性**：Rust 没有 fast-math，f64 运算仍是严格 IEEE，且 `src/` 里没有任何
# `debug_assertions` / `target_feature` 分支（grep 过）⇒ 同 seed 的 `--digest` 逐字不变。
# ⚠ 代价：档位一变，依赖要按新档位重编一次（首次 `cargo nextest run` 慢一两分钟），之后每轮都省。
[profile.test]
opt-level = 0
debug = 1
