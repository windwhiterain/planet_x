[workspace]
members = ["web"]
resolver = "3"

[package]
name = "planet_x"
version = "0.1.0"
edition = "2024"
description = "A turn-based solar-system sandbox trajectory generator for the Planet X game."

[dependencies]
serde = { version = "1", features = ["derive"] }
# Generate a machine-readable JSON Schema for the agent's state view, so the
# agent can *introspect* the schema (`schema` / `meta.schema`) instead of
# memorising it — the "self-describing schema" piece of the architecture.
schemars = { version = "0.8", features = ["derive"] }
ron = "0.8"
clap = { version = "4", features = ["derive"] }
comfy-table = "7"
colored = "2"
# `float_roundtrip`：**解析**浮点必须精确。默认的快速解析器对某些十进制串会落到相邻的
# double 上（实测：文件里写着 `1.4000000000000001`，默认解析读回来是 `1.4`）——于是
# 「读出来的数 ≠ 写出去的数」。这个项目全靠数值说话（投影 → Python → diff → 回读），
# 这种静默漂移必须掐掉。
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.release]
opt-level = 3

# **测试档**（`cargo test` / `cargo nextest run` 用的就是它——它默认继承 `dev` 的
# `opt-level = 0`）：引擎是「字符串键 BTreeMap + 大量小函数」的形态，未优化的机器码在这种
# 代码上比优化过的慢一个数量级；全档 ~110 s 里绝大部分是这一项，**不是断言**。
#
# 只提 `opt-level`，别的都**故意不动**：
# * `debug-assertions` / `overflow-checks` 保持开启——它们要抓的 bug 比这点时间值钱；
# * 不碰 `lto` / `codegen-units`：换来的运行时间抵不过编译时间的增加。
#
# **行为中性**：Rust 没有 fast-math，f64 运算仍是严格 IEEE ⇒ 同 seed 的 `--digest`
# 必须**逐字不变**。这是验收判据：变了就是改错了，不是「浮点正常抖动」。
#
# ⚠ 代价：这个档位一变，**所有依赖要按新档位重编一次**（首次 `cargo nextest run` 会慢
# 一两分钟），换完之后每一轮都省。
[profile.test]
opt-level = 2
