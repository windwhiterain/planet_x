[workspace]
members = ["web"]
resolver = "3"

[package]
name = "planet_x"
version = "0.1.0"
edition = "2024"
description = "A turn-based solar-system sandbox trajectory generator for the Planet X game."

[dependencies]
serde = { version = "1", features = ["derive"] }
# Generate a machine-readable JSON Schema for the agent's state view, so the
# agent can *introspect* the schema (`schema` / `meta.schema`) instead of
# memorising it — the "self-describing schema" piece of the architecture.
schemars = { version = "0.8", features = ["derive"] }
ron = "0.8"
clap = { version = "4", features = ["derive"] }
comfy-table = "7"
colored = "2"
# `float_roundtrip`：**解析**浮点必须精确。默认的快速解析器对某些十进制串会落到相邻的
# double 上（实测：文件里写着 `1.4000000000000001`，默认解析读回来是 `1.4`）——于是
# 「读出来的数 ≠ 写出去的数」。这个项目全靠数值说话（投影 → Python → diff → 回读），
# 这种静默漂移必须掐掉。
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }

[profile.release]
opt-level = 3

# **测试档 = 不优化**（没有 `[profile.test]` 段 ⇒ 继承 `dev` 的 `opt-level = 0`）。
#
# 这里曾经写着 `opt-level = 2`（`test-wall-clock.md` 的 P0，2025）：那时**长局用例住在 Rust 里**，
# 全档 ~110 s 里绝大部分是**模拟的机器码**——提档后最重的长局 77.2 → 18.1 s（4.27×），值。
#
# **2026-10 之后那条依据没了**：长局/中档用例搬到 `play/tests/`（数据级断言，跑在 **release**
# 二进制 + 投影缓存上，见 `test-decoupled-suite.md`），Rust 侧只剩 223 条**快档**单测。
# 它们真跑只要几秒，而 `opt-level = 2` 让每次「改一个文件」的 test 档重编从个位数秒变成
# 几十秒——**编译现在是唯一的大头**（用户裁决：*「test 不要 opt」*）⇒ 回到 `dev` 默认。
#
# 想在 Rust 侧跑长局不是理由：长局有 `play/tests/run.py 3`（release 二进制 + 缓存），
# 那才是该付优化编译钱的地方。
#
# **行为中性**：Rust 没有 fast-math，f64 运算仍是严格 IEEE ⇒ 同 seed 的 `--digest` 逐字不变。
# ⚠ 代价：档位一变，依赖要按新档位重编一次（首次 `cargo nextest run` 慢一两分钟），之后每轮都省。
