[package]
name = "planet_x"
version = "0.1.0"
edition = "2024"

[workspace]
# ⚠ `px_render`（bevy 宿主）已在 S8-a 删除：判据的靶子在 `art/anchor/`，
#   今天唯一在的宿主是 `px_render_wgpu`（裸 wgpu）。删它**不减少**任何判据 ——
#   六张判据图 + 六份冻产物仍然逐字节可比（回归集复测过）。
members = ["game", "px_protocol", "px_shader", "px_pass", "px_render_wgpu", "px_ops", "px_mc", "px_graphs", "px_verify", "px_probe"]
default-members = ["game", "px_protocol", "px_shader", "px_pass", "px_ops", "px_mc", "px_graphs", "px_verify"]

[dependencies]

[profile.dev]
debug = "line-tables-only"
