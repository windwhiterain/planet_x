[package]
name = "planet_x"
version = "0.1.0"
edition = "2024"
description = "A turn-based solar-system sandbox trajectory generator for the Planet X game."

[dependencies]
serde = { version = "1", features = ["derive"] }
# Generate a machine-readable JSON Schema for the agent's state view, so the
# agent can *introspect* the schema (`schema` / `meta.schema`) instead of
# memorising it — the "self-describing schema" piece of the architecture.
schemars = { version = "0.8", features = ["derive"] }
ron = "0.8"
clap = { version = "4", features = ["derive"] }
comfy-table = "7"
colored = "2"
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["fs"] }
serde_json = "1"

[profile.release]
opt-level = 3
